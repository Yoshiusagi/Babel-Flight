<style>

.soc-list li{display:flex!important}
.soc-list li b{flex:1;min-width:0}
.coop-ask{margin:0!important;min-height:40px!important;width:auto!important;padding:0 12px!important;font-size:13px!important;white-space:nowrap}
.coop-block{margin-top:14px;padding:12px;border-radius:14px;border:1px solid var(--line);background:var(--surface2)}

.coop-home .dim{margin:6px 0 0;font-size:13px}

.jd-who{padding:14px 0 10px}

.jd-home .go{margin-top:12px}
.jd-home .dim{margin:6px 0 0;font-size:13.5px;line-height:1.7}
