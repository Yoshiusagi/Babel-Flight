<style>
/* ---- オフライン完全版 (f36_offline.js) ---- */
.off-row{display:grid;grid-template-columns:1fr auto;align-items:center;gap:10px;margin-top:10px;padding:12px;border-radius:14px;border:1.5px solid var(--line)}
.off-row.ok{border-color:color-mix(in srgb,var(--good) 55%,transparent)}
.off-row b{display:block;font-size:15px}
.off-row small{font-size:12px;color:var(--ink2)}
.off-row.ok small{color:var(--good)}
.off-row .go.sm,.off-row .ghost.sm{margin:0;min-height:44px;padding:0 16px;width:auto}
.off-warn{margin-top:6px;font-size:12.5px;color:var(--ink2)}
.off-prog{height:10px;margin-top:12px;border-radius:999px;background:var(--surface2);overflow:hidden}
.off-prog i{display:block;height:100%;background:var(--signal);border-radius:inherit;transition:width .25s linear}
.off-prog-t{display:flex;justify-content:space-between;align-items:center;margin-top:6px;font-size:12.5px;color:var(--ink2)}
.off-stop{position:static!important;width:auto!important;height:36px!important;padding:0 12px!important;border-radius:999px!important;font-size:12.5px}
.off-what{margin-top:12px}
.off-what summary{cursor:pointer;min-height:36px;font-size:13px;color:var(--ink2)}
.off-what ul{margin:4px 0 0;padding-left:4px;list-style:none;display:grid;gap:4px;font-size:13px;line-height:1.6}
.off-del{display:block;margin:12px auto 0;min-height:40px;padding:0 12px;border:0;background:none;color:var(--ink2);font-size:12.5px;text-decoration:underline}
.off-del.confirm{color:var(--bad)}
</style>
