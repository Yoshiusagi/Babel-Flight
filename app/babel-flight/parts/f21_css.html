<style>
/* ---- プランの購入 (Stripe, test mode) ---- */
.bill-card .bill-test{display:flex;flex-direction:column;gap:3px;margin-top:10px;padding:10px 12px;border-radius:10px;border:1.5px dashed var(--info);background:var(--surface2);font-size:12.5px;line-height:1.55}
.bill-card .bill-test b,.bill-sheet .bill-test b{font-size:13px}
.bill-test code{font:700 12.5px var(--f-mono);white-space:nowrap}
.bill-test.sm{flex-direction:row;flex-wrap:wrap;gap:4px 8px;align-items:baseline;margin:8px 0 0;padding:8px 10px;border-radius:10px;border:1.5px dashed var(--info);background:var(--surface2);font-size:12.5px}
.bill-msg{margin-top:10px;padding:10px 12px;border-radius:10px;background:var(--surface2);font-size:13.5px;line-height:1.5}
.bill-msg.ok{box-shadow:inset 3px 0 0 var(--good)}
.bill-msg.warn{box-shadow:inset 3px 0 0 var(--bad)}
.bill-msg.wait{box-shadow:inset 3px 0 0 var(--info)}
.bill-note{margin-top:8px;font-size:13px;line-height:1.55}
.bill-note.bad{color:var(--bad)}
.bill-now{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 10px;margin-top:12px;padding:12px;border-radius:12px;background:var(--ink);color:var(--bg)}
.bill-now .lbl{color:inherit;opacity:.7}
.bill-now b{font-size:17px}
.bill-yen{font:700 14px var(--f-mono);white-space:nowrap}
.bill-yen small{font:400 10.5px var(--f-body);margin-left:2px;opacity:.75}
.bill-plans{display:grid;gap:8px;margin-top:12px}
.bill-plan{display:flex;flex-direction:column;align-items:stretch;gap:4px;width:100%;padding:12px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);text-align:left}
.bill-plan .bp-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.bill-plan b{font-size:15px}
.bill-plan>small{font-size:12px;color:var(--ink2);line-height:1.45}
.bill-plan:active{transform:translateY(1px)}
.bill-plan:disabled{opacity:.5}
.bill-card .ghost{display:block;width:100%;margin-top:8px}
.bill-sheet h3{margin-top:4px;color:var(--ink)}
.bill-test.sm b{margin-right:8px}
.bill-dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:7px 12px;margin:12px 0 4px;padding:12px;border-radius:12px;background:var(--surface2);font-size:13px;line-height:1.5}
.bill-dl dt{font-weight:700;white-space:nowrap;color:var(--ink2)}
.bill-dl dd{margin:0;min-width:0}
.bill-dl ul{margin:0;padding-left:1.1em}
.bill-ck{display:flex;align-items:flex-start;gap:10px;margin-top:10px;font-size:13.5px;line-height:1.5;cursor:pointer}
.bill-ck input{flex:none;width:20px;height:20px;margin:1px 0 0;accent-color:var(--signal)}
.bill-sheet .go{margin-top:12px}
.bill-sheet .ghost{display:block;width:100%;margin-top:8px}
@media (max-width:359px){.bill-dl{grid-template-columns:minmax(0,1fr)}.bill-dl dd{margin-bottom:4px}}
</style>
