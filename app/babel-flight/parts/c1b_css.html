<style>
/* v2 additions: roadmap, onboarding, profession picker, review modes, AI */
.jh{font:700 17px/1.35 var(--f-body)!important;letter-spacing:0!important;text-transform:none!important}
.lead{font-size:14px;margin-top:10px;line-height:1.7}
.hint{font-size:12.5px;margin-top:6px}
.wide{display:block;width:100%;margin-top:14px}
.top .brand{font-size:19px}
.stats-top{gap:10px;align-items:center}
.goal-pill{display:flex;align-items:center;gap:5px}
.goal-pill>span{display:flex;flex-direction:column;align-items:flex-start;gap:3px}
.goal-pill .v{font:700 15px/1 var(--f-mono)}
.ring{width:30px;height:30px}
.route svg{max-height:150px}

/* course chooser */
.course{display:flex;align-items:center;gap:12px;width:100%;margin-top:14px;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);text-align:left}
.ccode{flex:none;width:52px;height:52px;border-radius:10px;background:var(--board);color:var(--signal);display:grid;place-items:center;font:700 15px var(--f-mono);letter-spacing:.06em}
.ctext{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.ctext b{font-size:17px}
.ctext small{font-size:12px;color:var(--ink2)}
.chev{font-size:28px;color:var(--ink2);line-height:1}

/* roadmap */
.sec{margin-top:22px}
.sec-h{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;background:var(--lc);color:#fff;border-radius:14px;padding:14px 16px}
.sec-h .lbl{color:rgba(255,255,255,.8)}
.sec-h h2{color:#fff;margin-top:6px}
.sec-h p{font-size:12.5px;opacity:.85;margin-top:2px}
.sec-n{font-size:15px;font-weight:700;background:rgba(0,0,0,.18);padding:6px 10px;border-radius:8px;flex:none}
.path{position:relative;width:300px;max-width:100%;margin:8px auto 0}
.path-line{position:absolute;left:0;top:0;overflow:visible}
.node-wrap{position:absolute;width:0;height:0}
.node{position:absolute;left:-32px;top:-32px;width:64px;height:64px;border-radius:50%;display:grid;place-items:center;border:0;background:var(--surface);color:var(--ink2);box-shadow:inset 0 0 0 2px var(--line),0 5px 0 var(--line);transition:transform .12s}
.node:active{transform:translateY(3px)}
.node svg{width:28px;height:28px}
.node .mono{font-size:19px;font-weight:700}
.node.done{background:var(--lc);color:#fff;box-shadow:0 5px 0 color-mix(in srgb,var(--lc) 60%,#000)}
.node.next{left:-38px;top:-38px;width:76px;height:76px;background:var(--signal);color:var(--on-signal);box-shadow:0 6px 0 #b98f00,0 0 0 8px color-mix(in srgb,var(--signal) 28%,transparent)}
.node.next svg{width:36px;height:36px}
.duedot{position:absolute;top:2px;right:2px;width:14px;height:14px;border-radius:50%;background:var(--bad);border:2px solid var(--bg)}
.bubble{position:absolute;left:0;top:-74px;transform:translateX(-50%);background:var(--ink);color:var(--bg);font:700 12px/1 var(--f-body);padding:7px 10px;border-radius:8px;white-space:nowrap}
.bubble::after{content:"";position:absolute;left:50%;bottom:-5px;margin-left:-5px;border:5px solid transparent;border-bottom:0;border-top-color:var(--ink)}
.node-lbl{position:absolute;left:-70px;top:42px;width:140px;text-align:center;font-size:12px;line-height:1.35;font-weight:500;color:var(--ink)}
.nstars{display:block;color:#d9a400;font-size:11px;letter-spacing:1px}
.nstars em{font-style:normal;color:var(--line)}
@media (prefers-reduced-motion:no-preference){.node.next{animation:pulse 2s ease-in-out infinite}}
@keyframes pulse{50%{box-shadow:0 6px 0 #b98f00,0 0 0 14px color-mix(in srgb,var(--signal) 10%,transparent)}}

/* sheets */
.sheet{max-height:86vh;overflow-y:auto;overscroll-behavior:contain}
.sheet.plain{--sc:var(--line);background:var(--bg)}
.sheet.plain .pass{margin-top:0}

/* review modes */
.mode-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-top:14px}
.mode-grid .card{margin-top:0;display:flex;flex-direction:column;gap:6px}
.card.mode p{font-size:13px}
.mcount{font-size:26px;font-weight:700;margin-top:auto}
.mcount small{font-size:12px;font-weight:400;color:var(--ink2)}
.go.sm{padding:12px;font-size:16px;margin-top:6px}
.warn{color:var(--bad);font-size:12.5px;margin-top:auto}
.atc-card{background:linear-gradient(160deg,var(--surface),color-mix(in srgb,var(--c-en) 10%,var(--surface)))}

/* settings */
.set-block{margin-top:14px}
.set-row b{font-size:15px}

/* profession grid */
.prof-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;margin-top:14px}
.prof{display:flex;flex-direction:column;align-items:flex-start;gap:3px;padding:12px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);text-align:left;min-width:0}
.prof b{font-size:14.5px}
.prof small{font:400 10.5px var(--f-mono);letter-spacing:.08em;color:var(--ink2)}
.pcode{font:700 13px var(--f-mono);letter-spacing:.08em;background:var(--board);color:var(--signal);padding:4px 7px;border-radius:5px;margin-bottom:4px}
.prof[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink);background:var(--surface2)}
.prof.none .pcode{background:var(--bg2);color:var(--ink2)}

/* onboarding */
.ob{padding-top:8px}
.ob-dots{display:flex;gap:6px}
.ob-dots i{flex:1;height:5px;border-radius:3px;background:var(--line)}
.ob-dots i.on{background:var(--lc)}
.ob-brand{margin-top:22px}
.ob-h{font:700 25px/1.4 var(--f-body);margin-top:14px;text-wrap:balance}
.ob-q{font:700 21px/1.4 var(--f-body);margin-top:22px}
.lang-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:14px}
.langc{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:3px;padding:14px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);text-align:left;overflow:hidden;min-width:0}
.langc::before{content:"";position:absolute;left:0;top:0;right:0;height:5px;background:var(--dc)}
.langc .code{font:700 24px/1 var(--f-mono);margin-top:4px}
.langc b{font-size:15px}
.langc small{font-size:11.5px;color:var(--ink2)}
.langc[aria-pressed="true"],.choice[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink);background:var(--surface2)}
.opt-list{display:grid;gap:10px;margin-top:14px}
.choice{display:flex;flex-direction:column;align-items:flex-start;gap:3px;padding:14px 16px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);text-align:left}
.choice b{font-size:16px}
.choice small{font-size:12.5px;color:var(--ink2);line-height:1.5}
.ob-acts{display:grid;grid-template-columns:1fr 2fr;gap:10px;margin-top:22px;padding-bottom:20px}
.ob-acts .go{margin-top:0}

/* options & hints */
.opt{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.opt .on{font:700 11px var(--f-mono);color:var(--ink2);border:1px solid var(--line);border-radius:4px;padding:1px 5px;flex:none}
.opt .oy{flex-basis:100%;font:400 12px var(--f-body);color:var(--ink2);padding-left:30px}
.newtag{margin-left:8px;font:700 10px var(--f-mono);letter-spacing:.1em;background:var(--signal);color:var(--on-signal);padding:2px 6px;border-radius:4px;vertical-align:2px}
.qh{text-transform:none;letter-spacing:.04em;font-family:var(--f-body);font-size:13px}

/* landing goal */
.goalbox{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-top:16px}
.goalbox span{font-size:13.5px}
.gbar{height:8px;background:var(--bg2);border-radius:4px;margin-top:8px;overflow:hidden}
.gbar i{display:block;height:100%;background:var(--good);border-radius:4px}
.gdone{margin-top:8px;font-weight:700;color:var(--good);font-size:13.5px}
.grade{font:700 26px/1.2 var(--f-body);letter-spacing:.02em;text-transform:none}

/* AI ask */
.aibox{display:grid;gap:8px}
.sq.ai{width:100%;border-style:dashed;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:8px 11px;border:1.5px solid var(--line);border-radius:999px;background:var(--surface);font-size:12.5px}
.typebox.sm{padding:10px 12px;font:400 14px var(--f-body)}
.aiout{white-space:pre-wrap;font-size:14px;line-height:1.75;background:var(--surface2);border-radius:8px;padding:0 12px;min-height:0}
.aiout:not(:empty){padding:10px 12px}
.aiout.wait{color:var(--ink2)}

/* ATC roleplay */
.sit p{font-size:14px;margin-top:4px}
.atclog{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.radio{position:relative;background:var(--board);border-radius:12px 12px 12px 4px;padding:10px 44px 12px 14px;max-width:92%;box-shadow:inset 0 0 0 1px #262c38}
.radio .lbl{color:#8a8f9c}
.radio p{font:700 15px/1.5 var(--f-mono);color:var(--flap);margin-top:4px}
.mini{position:absolute;right:8px;top:8px;width:30px;height:30px;border:1px solid #2c3340;border-radius:8px;background:transparent;color:#c9ccd4;display:grid;place-items:center}
.mini svg{width:16px;height:16px}
.me{align-self:flex-end;background:var(--surface);border:1.5px solid var(--lc);border-radius:12px 12px 4px 12px;padding:10px 14px;max-width:92%}
.me p{font:500 15px/1.5 var(--f-mono);margin-top:4px}
.fb{align-self:flex-end;max-width:92%;font-size:13.5px;line-height:1.6;background:var(--surface2);border-radius:10px;padding:8px 12px}
.fstars{color:#d9a400;margin-right:8px;letter-spacing:1px}
.fstars em{font-style:normal;color:var(--line)}
.better{margin-top:6px;font:500 13.5px/1.5 var(--f-mono)}
.better .lbl{display:block;margin-bottom:2px}
.atc-in{position:sticky;bottom:0;background:var(--bg);padding:12px 0 8px;margin-top:12px;display:grid;gap:8px}
.hintline{font:500 13px var(--f-mono);color:var(--ink2)}
.hidden-hint{display:none}
.top{flex-wrap:wrap;row-gap:12px}
.stats-top{flex-basis:100%;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stats-top .pill,.goal-pill{flex-direction:row;align-items:center;justify-content:flex-start;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:7px 10px;min-width:0}
.goal-pill{padding:4px 10px 4px 6px}
.goal-pill>span{flex-direction:row;align-items:baseline;gap:6px}
.stats-top .lbl{white-space:nowrap}
.stats-top .v{white-space:nowrap}
.aibox .row2 .sq{flex:none;white-space:nowrap}
.aibox .row2 input{flex:1;min-width:0}
</style>
