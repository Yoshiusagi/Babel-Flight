<style>
/* ===== 出発案内板 (ビジネス): colors (replace the old ラウンジ navy) ===== */
:root[data-cabin="lounge"]{--bg:#0d1118;--bg2:#11161f;--surface:#151b25;--surface2:#1b2330;--ink:#eef1f6;--ink2:#a6b1c2;--line:#2a3342;--signal:#e8c46a;--on-signal:#14100a;
  --dawn1:#141a24;--dawn2:#0d1118;--day1:#121822;--day2:#0d1118;--dusk1:#161822;--dusk2:#0d1118;--night1:#080b10;--night2:#0d1118;--cloud:rgba(232,196,106,.04)}
:root[data-cabin="lounge"] body{background:#0d1118}
[data-cabin="lounge"] .card{background:var(--surface);border-color:var(--line)}
[data-cabin="lounge"] .lbl{color:#e8c46a}
[data-cabin="lounge"] .dim{color:var(--ink2)}
[data-cabin="lounge"] .go{background:linear-gradient(180deg,#f2d27f,#d9b257);color:#0d1118;box-shadow:0 5px 0 #9c7a2c}
[data-cabin="lounge"] .tabs{background:#090c11;border-top-color:#222a36}
[data-cabin="lounge"] .sheet{background:#121822;border-top-color:#e8c46a}

/* ===== 出発案内板: home ===== */
.xb-head{padding:4px 2px 0}
.xb-head h1{margin-top:2px;font-size:22px}
.xb-head p{margin-top:2px;font-size:13px;color:var(--ink2)}
.xb-go{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;min-height:66px;margin-top:16px;padding:10px 18px;border:0;border-radius:14px;background:linear-gradient(180deg,#f2d27f,#d9b257);color:#0d1118;text-align:left;box-shadow:0 6px 0 #9c7a2c}
.xb-go:active{transform:translateY(3px);box-shadow:0 3px 0 #9c7a2c}
.xb-go b{display:block;font-size:17px}
.xb-go small{display:block;margin-top:1px;font-size:12px}
.xb-tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:18px}
.xb-tile{display:block;width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);text-align:left}
.xb-l{display:block;font-size:11.5px;color:var(--ink2)}
.xb-digits{display:flex;align-items:flex-end;flex-wrap:wrap;gap:3px;margin-top:8px}
.xb-d{display:grid;place-items:center;width:26px;height:36px;border-radius:4px;font:700 26px/1 var(--f-disp);color:var(--ink);background:linear-gradient(#232b38 0 49%,#06080c 49% 52%,#1d2430 52%)}
.xb-u{margin-left:2px;font-size:13px;font-weight:700}
.xb-foot{display:block;margin-top:6px;font-size:11.5px;color:var(--signal)}
.xb-board{margin:16px -6px 0;padding:10px 8px 12px;border:1px solid #222a36;border-radius:14px;background:#06080c;box-shadow:inset 0 0 0 4px #0b0e14}
.xb-h{display:flex;justify-content:space-between;align-items:baseline;padding:0 4px 8px;font-size:13.5px;font-weight:700;color:var(--ink)}
.xb-h .mono{font-size:12px;color:var(--ink2)}
.xb-cols{display:grid;grid-template-columns:60px minmax(0,1fr) 78px;gap:6px;padding:0 4px 6px;font:10px var(--f-mono);letter-spacing:.14em;color:#8b97a8}
.xb-rows{display:grid;gap:5px}
.xb-row{display:grid;grid-template-columns:60px minmax(0,1fr) 78px;gap:6px;align-items:center;width:100%;padding:0;border:0;border-radius:4px;background:none;color:#c9d2de;text-align:left}
.xb-row .fl{display:block;min-height:40px;padding:10px 6px;border-radius:3px;overflow:hidden;white-space:nowrap;font-size:13px;line-height:20px;background:linear-gradient(#1a212c 0 49%,#06080c 49% 52%,#161c26 52%)}
.xb-row .fl .flapw{flex-wrap:nowrap}
.xb-row .no,.xb-row .st{text-align:center;font-family:var(--f-mono);font-size:12px}
.xb-row .to{padding-left:8px}
.xb-row.arr .st{color:#5fd08f}
.xb-row.due .st{color:#ffab4a}
.xb-row.lk{opacity:.6}
.xb-row.now{margin:0 -3px;padding:3px;width:calc(100% + 6px);border-radius:6px;box-shadow:0 0 0 1.5px var(--signal)}
.xb-row.now .fl{color:#ffd65c;font-weight:700;background:linear-gradient(#1f2633 0 49%,#06080c 49% 52%,#1a2130 52%)}
.xb-row.now .st{background:#ffd65c;color:#0d1118}

/* ===== 出発案内板: the question is a boarding pass ===== */
[data-cabin="lounge"] #bd,[data-cabin="lounge"] #led,[data-cabin="lounge"] .profile,[data-cabin="lounge"] .phase{display:none}
[data-cabin="lounge"] .xb-pass{display:block;position:relative;margin-top:14px;border-radius:16px;background:#f4efe2;color:#14181f;overflow:hidden;box-shadow:0 16px 40px rgba(0,0,0,.5)}
.xp-band{display:flex;justify-content:space-between;gap:8px;padding:9px 16px;background:#14181f;color:#e8c46a;font:10.5px var(--f-mono);letter-spacing:.08em;white-space:nowrap}
.xp-route{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;padding:10px 16px 0}
.xp-route small,.xp-info small{display:block;font:9.5px var(--f-mono);letter-spacing:.14em;color:#5d6470}
.xp-route b{font:700 30px/1.05 var(--f-disp)}
.xp-route div:last-child{text-align:right}
.xp-route svg{color:#8a6a1f}
.xp-info{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1.3fr);gap:10px;padding:6px 16px 12px;font:11px var(--f-mono)}
.xp-info div{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.xp-info div:last-child{text-align:right}
.xp-cut{position:relative;height:0;margin:0 14px;border-top:2px dashed #c9bfa6}
.xp-cut::before,.xp-cut::after{content:'';position:absolute;top:-13px;width:24px;height:24px;border-radius:50%;background:var(--bg)}
.xp-cut::before{left:-26px}
.xp-cut::after{right:-26px}
.xp-q{display:flex;flex-direction:column;gap:6px;padding:14px 18px 18px}
.xp-q .cp-x{font-size:12px;font-weight:700;letter-spacing:.06em;color:#7a5c17}
.xp-q .cp-m{font-size:21px;font-weight:700;line-height:1.4;overflow-wrap:anywhere}
.xp-q .cp-m.ko{font-family:var(--f-ko)}
[data-cabin="lounge"] .opts{counter-reset:o}
[data-cabin="lounge"] .opt{display:flex;align-items:center;gap:12px;min-height:54px;border-radius:10px;border-color:var(--line);background:var(--surface);color:#dfe5ee}
[data-cabin="lounge"] .opt .on{display:none}
[data-cabin="lounge"] .opt::before{counter-increment:o;content:counter(o,upper-alpha);flex:none;font:700 13px var(--f-mono);color:#8b97a8}
[data-cabin="lounge"] .opt.ok{border-color:var(--good);background:color-mix(in srgb,var(--good) 14%,var(--surface))}
[data-cabin="lounge"] .opt.no{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--surface))}
[data-cabin="lounge"] #sheetHost .sheet[role="status"] .sheet-in::after{content:'← 半券をちぎるように、左へスワイプしても次へ'}
</style>
