<style>
/* ---- あなたに合わせる: reasons, weak points, level sheet, new-phrase card, hint ---- */
.wchoice{flex-direction:row;align-items:center;gap:12px}
.wchoice .wi{flex:none;width:34px;height:34px;display:grid;place-items:center;border-radius:10px;background:var(--surface2);font-size:19px;line-height:1}
.wchoice .wt{display:flex;flex-direction:column;gap:2px;min-width:0}
.wchoice[aria-pressed="true"] .wi{background:color-mix(in srgb,var(--lc) 18%,var(--surface))}
.weak-list .wchoice[aria-pressed="true"]{border-color:var(--lc);box-shadow:inset 0 0 0 1.5px var(--lc)}
.wchoice.none{border-style:dashed}
.ob .go:disabled{opacity:.45}
.tune-card{border-left:4px solid var(--lc)}
.tune-card .row2{margin-top:12px}
.lv-sheet .opt-list{margin:12px 0 4px}
.lv-sheet .ghost{margin-top:8px;width:100%}
.learn-card{display:flex;flex-direction:column;gap:10px;padding:16px;border:1.5px solid var(--line);border-radius:14px;background:var(--surface);box-shadow:0 10px 24px -18px var(--shadow)}
.learn-card .lc-t{font:700 26px/1.3 var(--f-body);word-break:break-word}
.learn-card .lc-t.ko{font-family:var(--f-ko)}.learn-card .lc-t.zh{font-family:var(--f-zh)}.learn-card .lc-t.ar{font-family:var(--f-ar);text-align:right}
.learn-card .lc-r{font-size:14px;color:var(--ink2);margin-top:-6px}
.learn-card .lc-jp{font-size:17px;font-weight:700;padding:8px 12px;border-radius:10px;background:var(--surface2)}
.learn-card .go{margin:4px 0 0}
.hint-go{width:100%;margin-top:10px;justify-content:flex-start;text-align:left}
.hint-go>span:last-child{display:flex;flex-direction:column}
.hint-go small{font-size:11.5px;color:var(--ink2)}
.opt.hinted{border-color:var(--signal);box-shadow:inset 0 0 0 1.5px var(--signal)}
.opt.struck{opacity:.32;text-decoration:line-through;transition:opacity .3s ease}
.hint-again{font-size:12px;margin:8px 0 0}
@media (prefers-reduced-motion:no-preference){
  .learn-card{animation:lcIn .35s cubic-bezier(.2,.8,.2,1) both}
  .opt.hinted{animation:hintPulse 1.2s ease-in-out 2}
}
@keyframes lcIn{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}
@keyframes hintPulse{50%{box-shadow:inset 0 0 0 1.5px var(--signal),0 0 0 6px color-mix(in srgb,var(--signal) 30%,transparent)}}

/* ---- 起動アニメ (opening the app): sky by time of day, a plane climbing out ---- */
.bootfx{position:fixed;inset:0;z-index:80;overflow:hidden;cursor:pointer;background:linear-gradient(180deg,var(--b1),var(--b2) 62%,var(--b3));transition:opacity .3s ease,transform .3s ease}
.bootfx.day{--b1:#2f7cf6;--b2:#80bbff;--b3:#e1f0ff}
.bootfx.dawn{--b1:#5f86d6;--b2:#ffb08c;--b3:#ffe3bb}
.bootfx.dusk{--b1:#26286a;--b2:#b04f8c;--b3:#ff8a5c}
.bootfx.night{--b1:#030817;--b2:#0b1736;--b3:#1c2c5b}
.bootfx.out{opacity:0;transform:scale(1.04)}
.bf-svg{position:absolute;inset:0;width:100%;height:100%}
.fx-trail{fill:none;stroke:rgba(255,255,255,.85);stroke-width:5;stroke-linecap:round}
.fx-trail.c{stroke:#ffcf26}
.fx-plane path{fill:#fff;stroke:rgba(10,20,40,.35);stroke-width:.5}
.bf-brand{position:absolute;left:0;right:0;top:38%;text-align:center;color:#fff;opacity:0;transform:translateY(10px);transition:opacity .28s ease .2s,transform .4s cubic-bezier(.2,.8,.2,1) .2s;text-shadow:0 2px 14px rgba(0,0,0,.28)}
.bootfx.play .bf-brand{opacity:1;transform:none}
.bf-brand b{display:block;font:700 36px/1 var(--f-disp);letter-spacing:.12em;text-transform:uppercase}
.bf-brand b span{color:#ffcf26;margin-left:.3em}
.bf-brand small{display:block;margin-top:10px;font-size:14px;letter-spacing:.08em;opacity:.92}
.bf-stars{position:absolute;inset:0;background-image:radial-gradient(1.4px 1.4px at 12% 18%,#fff 60%,transparent),radial-gradient(1px 1px at 32% 8%,#fff 60%,transparent),radial-gradient(1.2px 1.2px at 58% 22%,#fff 60%,transparent),radial-gradient(1px 1px at 76% 12%,#fff 60%,transparent),radial-gradient(1.5px 1.5px at 88% 30%,#fff 60%,transparent),radial-gradient(1px 1px at 22% 40%,#fff 60%,transparent),radial-gradient(1.2px 1.2px at 66% 46%,#fff 60%,transparent),radial-gradient(1px 1px at 44% 34%,#fff 60%,transparent);opacity:.85}
.bf-moon{position:absolute;right:14%;top:12%;width:46px;height:46px;border-radius:50%;box-shadow:-10px 6px 0 0 #f4f1d8;transform:rotate(-20deg)}
.bf-sun{position:absolute;left:50%;bottom:-70px;width:220px;height:220px;margin-left:-110px;border-radius:50%;background:radial-gradient(circle,#fff6d6 0 30%,rgba(255,214,140,.7) 45%,transparent 70%)}
.bf-cl{position:absolute;width:190px;height:58px;border-radius:40px;background:#fff;opacity:.75;filter:blur(2px)}
.bf-cl::before,.bf-cl::after{content:'';position:absolute;background:#fff;border-radius:50%}
.bf-cl::before{width:84px;height:84px;left:28px;top:-38px}.bf-cl::after{width:62px;height:62px;right:30px;top:-24px}
.night .bf-cl{opacity:.12}.dusk .bf-cl{opacity:.35}
.bf-cl.f1{left:-30px;top:64%}.bf-cl.f2{right:-50px;top:24%;transform:scale(.8)}
.bf-cl.l1{left:12%;top:58%}.bf-cl.r1{right:8%;top:50%}.bf-cl.l2{left:-4%;top:30%;transform:scale(.8)}.bf-cl.r2{right:-6%;top:22%;transform:scale(.9)}
.bf-runway{position:absolute;left:50%;bottom:0;width:150vw;height:34vh;margin-left:-75vw;background:linear-gradient(180deg,#3a4250,#232831);clip-path:polygon(44% 0,56% 0,100% 100%,0 100%);overflow:hidden}
.bf-runway i{position:absolute;left:50%;width:6px;height:9%;margin-left:-3px;background:#fff;opacity:.9}
.bf-runway i:nth-child(1){top:4%}.bf-runway i:nth-child(2){top:24%}.bf-runway i:nth-child(3){top:44%}.bf-runway i:nth-child(4){top:64%}.bf-runway i:nth-child(5){top:84%}
.bootfx.play .bf-cl.f1,.bootfx.play .bf-cl.f2{transition:transform .9s linear;transform:translateY(42vh)}
.bootfx.play .bf-cl.l1,.bootfx.play .bf-cl.l2{transition:transform .8s cubic-bezier(.3,.6,.3,1);transform:translateX(-70vw)}
.bootfx.play .bf-cl.r1,.bootfx.play .bf-cl.r2{transition:transform .8s cubic-bezier(.3,.6,.3,1);transform:translateX(70vw)}
.bootfx.play .bf-runway{transition:transform .8s cubic-bezier(.5,0,.8,.6);transform:translateY(36vh)}
.bootfx.play .bf-runway i{transition:transform .8s linear;transform:translateY(240%)}
.bootfx.play .bf-sun{transition:transform .9s ease-out;transform:translateY(40px)}
/* ---- right answers in a row ---- */
.fx-combo{position:fixed;left:0;right:0;top:0;height:min(220px,30vh);z-index:40;pointer-events:none}
.fx-combo svg{position:absolute;inset:0;width:100%;height:100%}
.fx-combo .fx-plane path{fill:var(--ink);stroke:var(--bg);stroke-width:.8}
.fx-combo .fx-trail{stroke:color-mix(in srgb,var(--lc) 65%,transparent);stroke-width:3}
.fc-badge{position:absolute;left:50%;top:calc(env(safe-area-inset-top,0px) + 96px);display:flex;align-items:center;gap:8px;padding:6px 14px;border-radius:999px;background:var(--ink);color:var(--bg);font-weight:700;font-size:14px;white-space:nowrap;box-shadow:0 8px 20px -8px var(--shadow);animation:fcIn 1.2s cubic-bezier(.2,.8,.2,1) both}
.fc-badge b{font-size:18px;color:var(--signal)}
@keyframes fcIn{0%{opacity:0;transform:translate(-50%,-8px) scale(.8)}15%{opacity:1;transform:translate(-50%,0) scale(1.06)}25%{transform:translate(-50%,0) scale(1)}80%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,-6px)}}
/* ---- landing screen: streak and goal ---- */
.streak-up{display:flex;align-items:center;justify-content:center;gap:8px;margin:12px auto 0;padding:8px 14px;border-radius:999px;background:var(--surface);border:1.5px solid var(--line);width:max-content;max-width:100%;font-size:14px;font-weight:700}
.su-n{display:inline-block;height:1.3em;overflow:hidden;font-size:18px;line-height:1.3em}
.su-n i{font-style:normal;display:block}
.streak-up.go .su-n i{transition:transform .5s cubic-bezier(.3,1.4,.5,1) .6s;transform:translateY(-100%)}
.su-fl{display:inline-block}
.streak-up.go .su-fl{animation:suFl .55s ease .5s 2}
@keyframes suFl{50%{transform:scale(1.35) rotate(-8deg)}}
.goalbox.goal-burst{position:relative;animation:gbPop .6s cubic-bezier(.3,1.5,.5,1) .9s both}
.goalbox.goal-burst::after{content:'';position:absolute;inset:-4px;border-radius:14px;border:2px solid var(--signal);opacity:0;animation:gbRing .9s ease-out 1s;pointer-events:none}
@keyframes gbPop{40%{transform:scale(1.04)}}
@keyframes gbRing{0%{opacity:.9;transform:scale(.97)}100%{opacity:0;transform:scale(1.12)}}
@media (prefers-reduced-motion:reduce){.streak-up .su-n i{transform:translateY(-100%)}.goalbox.goal-burst,.goalbox.goal-burst::after,.streak-up .su-fl{animation:none}}
/* ---- NOTAM (update notice) ---- */
.notam-sheet{--sc:var(--ink)}
.notam-sheet .sheet-in{max-height:min(80vh,660px);overflow:auto}
.nt-head{display:flex;align-items:center;gap:8px}
.nt-tag{font-size:11px;font-weight:700;letter-spacing:.14em;padding:3px 8px;border-radius:4px;background:var(--ink);color:var(--bg)}
.notam-sheet h3{margin-top:6px}
.nt-items{display:grid;gap:14px;margin:12px 0 14px}
.nt-item{display:flex;gap:12px;align-items:flex-start}
.nt-ic{flex:none;width:38px;height:38px;border-radius:10px;display:grid;place-items:center;background:var(--surface2);font-size:20px}
.nt-tx b{font-size:15px}
.nt-tx p{font-size:13px;line-height:1.6;color:var(--ink2);margin-top:2px}
.nt-go{margin-top:6px;padding:6px 12px;font-size:13px}
.nt-date{display:block;margin-top:12px}
.nt-all{width:100%;margin-top:14px;display:flex;flex-direction:column;align-items:flex-start;gap:2px}
.nt-all small{font-size:12px;color:var(--ink2)}
@media (prefers-reduced-motion:no-preference){.nt-item{animation:lcIn .4s cubic-bezier(.2,.8,.2,1) both}.nt-item:nth-child(2){animation-delay:.08s}.nt-item:nth-child(3){animation-delay:.16s}}
</style>
