<style>
/* ---- Liquid Glass (iOS 26 の見た目を Web で近づける): 浮かぶカプセルのタブバーと、すりガラスのシート.
   客室(data-cabin)の色は今まで通り優先する(その指定は詳細度が高い)。 ---- */
:root{--glass:rgba(255,255,255,.58);--glass-edge:rgba(255,255,255,.78);--glass-shade:rgba(16,24,40,.16);--glass-blur:saturate(190%) blur(26px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--glass:rgba(28,34,50,.56);--glass-edge:rgba(255,255,255,.14);--glass-shade:rgba(0,0,0,.45)}}
:root[data-theme="dark"]{--glass:rgba(28,34,50,.56);--glass-edge:rgba(255,255,255,.14);--glass-shade:rgba(0,0,0,.45)}
.tabs{left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));padding:6px 8px;border:1px solid var(--glass-edge);border-radius:30px;background:var(--glass);-webkit-backdrop-filter:var(--glass-blur);backdrop-filter:var(--glass-blur);box-shadow:inset 0 1px 0 var(--glass-edge),0 10px 30px var(--glass-shade)}
.tabs-in{max-width:520px}
.sheet{left:8px;right:8px;bottom:calc(8px + env(safe-area-inset-bottom,0px));border:1px solid var(--glass-edge);border-radius:30px;background:var(--glass);-webkit-backdrop-filter:var(--glass-blur);backdrop-filter:var(--glass-blur);box-shadow:inset 0 1px 0 var(--glass-edge),0 14px 40px var(--glass-shade)}
/* 透明度を下げる設定・古い端末: ふつうの面にもどす */
@media (prefers-reduced-transparency:reduce){.tabs,.sheet{background:var(--surface);-webkit-backdrop-filter:none;backdrop-filter:none}}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.tabs,.sheet{background:var(--surface)}}
/* the iOS app shows the system tab bar instead (f20_native.js natTabsSync) */
body.native-tabs #tabs{display:none !important}
/* Liquid Calm (A): 空の上に、ゆっくり呼吸する光の層をかさねて、水面のようななめらかさを出す.
   色は --cloud を使うので、ふつうの空・夜の空の両方でなじむ。動きを減らす設定では止める。 */
#sky::before{content:"";position:absolute;inset:-18%;pointer-events:none;
  background:radial-gradient(38% 30% at 28% 34%,var(--cloud),transparent 72%),radial-gradient(34% 26% at 74% 62%,var(--cloud),transparent 74%);
  opacity:.5;filter:blur(28px);animation:liquidCalm 26s ease-in-out infinite alternate}
@keyframes liquidCalm{from{transform:translate(0,0) scale(1)}to{transform:translate(4%,-3%) scale(1.07)}}
@media (prefers-reduced-motion:reduce){#sky::before{animation:none}}
</style>
