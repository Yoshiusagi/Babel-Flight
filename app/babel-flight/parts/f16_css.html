<style>
/* share (standalone site only) */
.share-ic{margin-left:auto;flex:none;width:42px;height:42px;display:grid;place-items:center;padding:0;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.share-ic:active{transform:scale(.95)}
.share-ic:focus-visible,.shr-btn:focus-visible,.share-go:focus-visible{outline:2px solid var(--signal);outline-offset:2px}
.share-go{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;color:var(--ink);text-align:left;cursor:pointer}
.share-go svg{flex:none}
.share-go span{font-weight:700;font-size:15px}
.share-go small{display:block;font-weight:400;font-size:11px;color:var(--ink2);margin-top:2px}
.share-sheet .sheet-in{gap:10px}
.shr-prev{position:relative;display:grid;place-items:center;margin:0 auto;height:min(34vh,330px);aspect-ratio:9/16;border-radius:12px;overflow:hidden;background:var(--surface2);box-shadow:0 10px 24px -14px var(--shadow)}
.shr-prev img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.shr-prev img:not([src]){visibility:hidden}
.shr-wait{position:relative;z-index:1;padding:0 12px;font-size:12.5px;line-height:1.5;color:var(--ink2);text-align:center}
.shr-wait[hidden]{display:none}
.shr-name{display:flex;align-items:center;justify-content:center;gap:8px;font-size:13.5px;cursor:pointer}
.shr-name input{width:20px;height:20px;margin:0;accent-color:var(--signal)}
.shr-img[hidden],.shr-more[hidden],.shr-note[hidden]{display:none}
.shr-more{display:grid;gap:8px}
.shr-sns{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.shr-row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.shr-btn{display:flex;align-items:center;justify-content:center;min-height:46px;padding:8px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font:700 14.5px/1.2 var(--f-body);text-decoration:none;text-align:center;cursor:pointer}
.shr-btn[aria-disabled="true"]{opacity:.45;cursor:default}
.shr-note{font-size:12px;line-height:1.5;text-align:center}
</style>
