<style>
/* ===== the iPhone app (html.app) + Sign in with Apple ===== */
.acct-a{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;padding:13px 14px;margin-bottom:10px;border:1.5px solid #000;border-radius:10px;background:#000;color:#fff;font-weight:600;font-size:15px}
.acct-a svg{width:19px;height:19px;flex:none;margin-top:-2px}
:root[data-theme="dark"] .acct-a{background:#fff;color:#000;border-color:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .acct-a{background:#fff;color:#000;border-color:#fff}}
.aic-list{margin:8px 0 10px 1.2em;font-size:13.5px;line-height:1.8}
.aic-sheet .go{margin-top:14px}
.aic-sheet .ghost{margin-top:8px;width:100%}
.app-card .set-row small{font-size:11.5px;line-height:1.5}
.app-time input{font:inherit;font-size:16px;padding:6px 10px;border:1.5px solid var(--line);border-radius:8px;background:var(--surface2);color:var(--ink)}

/* the status bar sits over the page in the app */
html.app #app{padding-top:calc(14px + env(safe-area-inset-top,0px))}
/* feels like an app: no text selection or long-press menus on controls, no rubber-band at the edges */
html.app{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html.app input,html.app textarea,html.app [contenteditable]{-webkit-user-select:text;user-select:text}
html.app body{overscroll-behavior:none}
html.app button,html.app a{-webkit-tap-highlight-color:transparent}
html.app :where(button:not(:disabled)){transition:transform .12s ease,filter .12s ease}
html.app :where(button:not(:disabled):active){transform:scale(.97);filter:brightness(.96)}

/* swipe-back arrow */
.swb{position:fixed;left:0;top:0;z-index:95;width:38px;height:38px;margin:-19px 0 0 -10px;display:grid;place-items:center;border-radius:50%;
  background:var(--surface);color:var(--ink2);box-shadow:0 6px 18px -6px var(--shadow);opacity:0;pointer-events:none;transition:opacity .15s,background .15s,color .15s}
.swb svg{width:20px;height:20px}
.swb.show{opacity:1}
.swb.go{background:var(--signal);color:var(--on-signal,#000)}

/* offline: "airplane mode" note above the tab bar */
.off-note{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(74px + env(safe-area-inset-bottom,0px));z-index:25;width:min(480px,calc(100% - 32px));
  display:flex;flex-direction:column;gap:2px;padding:9px 14px;border-radius:12px;background:var(--ink);color:var(--bg);font-size:12px;line-height:1.5;
  box-shadow:0 10px 24px -12px var(--shadow);animation:up .25s ease-out}
.off-note b{font-size:13px;letter-spacing:.02em}
@media (prefers-reduced-motion:reduce){.off-note{animation:none}html.app :where(button:not(:disabled)){transition:none}}
</style>
