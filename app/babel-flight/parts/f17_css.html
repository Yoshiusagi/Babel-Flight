<style>
/* classes (standalone site, test account only) */
.modesw.four{grid-template-columns:repeat(4,minmax(0,1fr))}
.modesw.four .modesw-ind{width:calc((100% - 8px) / 4)}
.modesw.four .modesw-ind.exam{transform:translateX(300%)}
.modesw.four button{padding:9px 2px}
.modesw.four button b{font-size:13.5px}
.modesw.four button small{font-size:10px;white-space:nowrap}
.stop.locked{opacity:.62}
.stop.locked .stop-st{color:var(--ink2);letter-spacing:0;font-size:11px}
/* 搭乗クラス card */
.cabin-seg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;margin-top:10px}
.cabin-seg button{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:10px 12px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);text-align:left;min-height:56px}
.cabin-seg button b{font-size:14px;line-height:1.3}
.cabin-seg button small{font-size:11.5px;color:var(--ink2)}
.cabin-seg button[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.cabin-seg button[aria-pressed="true"] small{color:inherit;opacity:.8}
.cabin-feat{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:6px}
.cabin-feat li{display:flex;justify-content:space-between;gap:10px;align-items:baseline;padding:8px 10px;border-radius:10px;background:var(--surface2);font-size:13.5px}
.cabin-feat li b{font-size:13px;text-align:right}
.cabin-feat li.off{opacity:.6}
.cabin-design{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;margin-top:6px}
.cabin-design button{display:grid;grid-template-columns:auto minmax(0,1fr);column-gap:8px;align-items:center;padding:8px 10px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);text-align:left}
.cabin-design button b{font-size:13.5px}
.cabin-design button small{grid-column:2;font-size:11px;color:var(--ink2)}
.cabin-design button[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 2px var(--signal)}
.cd-sw{grid-row:span 2;width:26px;height:26px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.18)}
.cd-base{background:linear-gradient(135deg,#ffcf26 0 50%,#0b1626 50%)}
.cd-window{background:linear-gradient(180deg,#bfe3ff,#ffd9b8);border-radius:45%}
.cd-lounge{background:linear-gradient(135deg,#0c1524 0 55%,#d4af62 55%)}
.cd-suite{background:linear-gradient(135deg,#0a0a0c 0 55%,#e9d6a8 55%)}
/* 検定 */
.exam-card .go.sm{margin-top:10px}
.exam-tm{margin-top:10px;font-size:11px;line-height:1.55;color:var(--ink2)}
.xg-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.xg-chg{flex:none;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 12px;font-size:12.5px;font-weight:700}
.xmeter{margin-top:10px}
.xm-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.xm-top b{font:700 26px/1.1 var(--f-disp);font-variant-numeric:tabular-nums}
.xm-top b small{font-size:13px}
.xm-bar{position:relative;height:10px;border-radius:5px;background:var(--surface2);box-shadow:inset 0 0 0 1px var(--line);margin-top:6px}
.xm-bar i{display:block;height:100%;border-radius:5px;background:var(--lc)}
.xm-pass{position:absolute;top:-4px;bottom:-4px;width:2px;margin-left:-1px;border-radius:1px;background:var(--ink)}
.xm-row{display:flex;justify-content:space-between;flex-wrap:wrap;gap:4px 8px;margin-top:6px;font-size:12px;color:var(--ink2)}
.xm-pl{font-weight:700;color:var(--ink)}
.xm-note{margin-top:6px;font-size:11.5px;line-height:1.55;color:var(--ink2)}
.xm-prep{margin-top:10px;padding:10px 12px;border-radius:10px;border:1px dashed var(--line);background:var(--surface2);font-size:13px;line-height:1.55}
.xm-prep b{display:block;font-size:13.5px}
.xm-land{margin:0;text-align:left}
.xg-kind{margin-top:14px}
.xg-kh b{font-size:15px;margin-right:8px}
.xg-kh small{font-size:12px;color:var(--ink2)}
.xg-chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.xg-chip{display:flex;flex-direction:column;align-items:center;min-width:64px;padding:8px 12px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink)}
.xg-chip b{font-size:14.5px}
.xg-chip small{margin-top:2px;font-size:10.5px;color:var(--ink2)}
.xg-chip[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 2px var(--signal)}
.xg-chip.locked{opacity:.75}
.xg-chip.none{opacity:.45}
.study-more .sm-sub{margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.study-more .sm-sub>b{font-size:15px}
.mock-tm{margin-left:auto;font:700 15px var(--f-mono);padding:6px 10px;border-radius:8px;background:var(--surface2);border:1px solid var(--line);font-variant-numeric:tabular-nums}
.mock-tm.low{color:var(--bad);border-color:var(--bad)}
/* 発音チェック */
.pron{display:grid;gap:6px;margin-top:8px}
.pron-go{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:10px 14px}
.pron-go svg{flex:none}
.pron-go span{font-weight:700;font-size:14.5px}
.pron-go small{display:block;font-weight:400;font-size:11.5px;color:var(--ink2)}
.pron-go.rec,.role-mic.rec{border-color:var(--bad);color:var(--bad);box-shadow:0 0 0 3px color-mix(in srgb,var(--bad) 22%,transparent)}
@media (prefers-reduced-motion:no-preference){.pron-go.rec svg,.role-mic.rec svg{animation:recPulse 1s ease-in-out infinite}}
@keyframes recPulse{50%{opacity:.35}}
.pron-out{font-size:13.5px;line-height:1.55}
.pron-out:empty{display:none}
.pron-out b{display:block;font-size:14.5px}
.pron-out span{display:block;color:var(--ink2)}
.pron-out q{color:var(--ink)}
.pron-out.good b{color:var(--good)}
.pron-out.ok b{color:var(--info)}
.pron-out.bad b,.pron-out.bad{color:var(--bad)}
/* 弱点レポート */
.report .rep-kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:4px}
.report .rep-kpis>div{background:var(--surface2);border-radius:10px;padding:8px 10px}
.report .rep-kpis .lbl{display:block}
.report .rep-kpis b{display:block;font:700 26px/1.15 var(--f-disp)}
.report .rep-kpis b small{font:500 13px var(--f-body);margin-left:2px}
.rep-diff{font-size:12px;font-weight:700}
.rep-diff.up{color:var(--good)}.rep-diff.down{color:var(--bad)}
.rep-h{font-size:13.5px;margin-top:12px}
.rep-weak{margin:6px 0 0;padding-left:1.4em;display:grid;gap:6px}
.rep-weak li{font-size:14px;line-height:1.4}
.rep-weak small{display:block;font-size:12px;color:var(--ink2)}
.report .go.sm{margin-top:10px}
.rep-trend{display:block;width:100%;height:auto;margin-top:6px;overflow:visible}
.rep-bar{fill:var(--lc)}
.rep-none{fill:var(--line)}
.rep-ref{stroke:var(--ink2);stroke-width:1;stroke-dasharray:3 4;opacity:.6}
.rep-ax{fill:var(--ink2);font-size:10px;font-family:var(--f-body)}
.rep-kinds{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:6px}
.rep-kinds li{display:grid;grid-template-columns:7.2em minmax(0,1fr) auto auto;gap:8px;align-items:center;font-size:13px}
.rk-n em{display:block;font-style:normal;font-size:10.5px;color:var(--bad);font-weight:700}
.rk-bar{height:10px;border-radius:5px;background:var(--surface2);overflow:hidden}
.rk-bar i{display:block;height:100%;border-radius:5px;background:var(--lc)}
.rep-kinds b{font-variant-numeric:tabular-nums}
.rep-kinds small{color:var(--ink2);font-size:11px;min-width:3.2em;text-align:right}
.coach{display:grid;gap:8px;margin-top:12px}
.coach .aiout:empty{display:none}
.coach .aiout{padding:10px 12px}
/* ロールプレイ */
.role-mic{padding:11px 12px}
.role-log .radio p,.role-log .me p,.role-log .better span{font-family:var(--f-body);font-size:15px;line-height:1.55;letter-spacing:0}

/* ===== 窓側の席 (プレミアムエコノミー) ===== */
:root[data-cabin="window"]{--bg:#eaf3fb;--bg2:#dbeaf7;--surface:#ffffff;--surface2:#eef5fc;--ink:#0d2238;--ink2:#4a6580;--line:#cfe0ef;--signal:#ffc94d;--on-signal:#2a1b00;--shadow:rgba(30,80,140,.18);--sky1:#bfe3ff;--sky2:#f2f8ff}
:root[data-cabin="window"][data-sky="morning"]{--sky1:#ffe2c6;--sky2:#dcefff}
:root[data-cabin="window"][data-sky="evening"]{--sky1:#ffc6a1;--sky2:#e7dcff}
@media (prefers-color-scheme:dark){:root[data-cabin="window"]:not([data-theme="light"]){--bg:#0a1424;--bg2:#0e1b30;--surface:#11203a;--surface2:#172a4a;--ink:#e8f1ff;--ink2:#a3b9d8;--line:#23395e;--shadow:rgba(0,0,0,.5);--sky1:#0b1835;--sky2:#22305e}}
:root[data-cabin="window"][data-theme="dark"]{--bg:#0a1424;--bg2:#0e1b30;--surface:#11203a;--surface2:#172a4a;--ink:#e8f1ff;--ink2:#a3b9d8;--line:#23395e;--shadow:rgba(0,0,0,.5);--sky1:#0b1835;--sky2:#22305e}
:root[data-cabin="window"] body{background:linear-gradient(180deg,var(--sky1),var(--sky2) 55%,var(--bg)) fixed}
[data-cabin="window"] .card{border-radius:26px;border-color:transparent;box-shadow:0 14px 34px -22px var(--shadow)}
[data-cabin="window"] .hero{border-radius:46px}
[data-cabin="window"] .id-card{border-radius:30px}
[data-cabin="window"] .go{border-radius:999px;letter-spacing:.08em}
[data-cabin="window"] .ghost,[data-cabin="window"] .sq,[data-cabin="window"] .choice,[data-cabin="window"] .opt{border-radius:18px}
[data-cabin="window"] .modesw{border-radius:999px}
[data-cabin="window"] .modesw-ind,[data-cabin="window"] .modesw button{border-radius:999px}
[data-cabin="window"] .sheet{border-radius:28px 28px 0 0;border-top-width:0;box-shadow:0 -18px 40px -16px var(--shadow)}
[data-cabin="window"] .tabs{background:color-mix(in srgb,var(--surface) 82%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top-color:transparent}

/* ===== ラウンジ (ビジネス) ===== */
:root[data-cabin="lounge"]{color-scheme:dark;--bg:#0c1524;--bg2:#101c30;--surface:#13203a;--surface2:#1b2b49;--ink:#f3ead7;--ink2:#b9ad93;--line:#2e3d5b;--signal:#d4af62;--on-signal:#1a1204;--good:#63d69f;--bad:#ff7d88;--info:#93b7ff;--shadow:rgba(0,0,0,.6)}
:root[data-cabin="lounge"]{--dawn1:#1a2440;--dawn2:#0c1524;--day1:#14223e;--day2:#0c1524;--dusk1:#211d38;--dusk2:#0c1524;--night1:#070c18;--night2:#0c1524;--cloud:rgba(212,175,98,.05);--star:.7}
:root[data-cabin="lounge"] body{background:radial-gradient(120% 55% at 50% 0%,#1d2e4f 0%,#0c1524 62%) fixed}
[data-cabin="lounge"] .card{background:linear-gradient(180deg,#16254a,#111c35);border-color:rgba(212,175,98,.26)}
[data-cabin="lounge"] .lbl{color:#cdb682;letter-spacing:.12em}
[data-cabin="lounge"] .dim{color:#b3a88f}
[data-cabin="lounge"] .go{background:linear-gradient(180deg,#e6c77f,#c39a4a);color:#1a1204;box-shadow:0 10px 22px -14px #d4af62}
[data-cabin="lounge"] .opt,[data-cabin="lounge"] .choice{min-height:60px;border-color:rgba(212,175,98,.3);background:#13203a;color:var(--ink)}
[data-cabin="lounge"] .ghost,[data-cabin="lounge"] .sq,[data-cabin="lounge"] .seg button{border-color:rgba(212,175,98,.35);color:var(--ink)}
[data-cabin="lounge"] .tabs{background:#0a1220;border-top-color:rgba(212,175,98,.3)}
[data-cabin="lounge"] .id-card{background:linear-gradient(135deg,#1b2b4b,#0e1830);color:var(--ink);box-shadow:inset 0 0 0 1px rgba(212,175,98,.45)}
[data-cabin="lounge"] .sheet{background:#111c33;border-top-color:#d4af62}

/* ===== スイート (ファースト) ===== */
:root[data-cabin="suite"]{color-scheme:dark;--bg:#0a0a0c;--bg2:#111114;--surface:#141417;--surface2:#1d1d22;--ink:#f6f0e4;--ink2:#b9af9c;--line:#2c2b30;--signal:#e9d6a8;--on-signal:#18130a;--good:#7fe0b0;--bad:#ff8c8c;--info:#a9c4ff;--shadow:rgba(0,0,0,.7)}
:root[data-cabin="suite"]{--dawn1:#1f1a13;--dawn2:#0a0a0c;--day1:#18150f;--day2:#0a0a0c;--dusk1:#231b12;--dusk2:#0a0a0c;--night1:#050506;--night2:#0a0a0c;--cloud:rgba(233,214,168,.04);--star:.55}
:root[data-cabin="suite"] body{background:radial-gradient(110% 50% at 50% 0%,#2a241b 0%,#0a0a0c 66%) fixed}
[data-cabin="suite"] .card{background:#131316;border-color:transparent;box-shadow:inset 0 0 0 1px rgba(233,214,168,.13),0 18px 40px -26px #000}
[data-cabin="suite"] .lbl{color:#d6c49a;letter-spacing:.2em}
[data-cabin="suite"] .dim{color:#bdb3a1}
[data-cabin="suite"] .go{border-radius:999px;background:linear-gradient(180deg,#f1e2bb,#d9bf86);color:#18130a}
[data-cabin="suite"] .opt{min-height:66px;font-size:17px;border-radius:16px;border-color:rgba(233,214,168,.22);background:#151518;color:var(--ink)}
[data-cabin="suite"] .choice,[data-cabin="suite"] .ghost,[data-cabin="suite"] .sq,[data-cabin="suite"] .seg button{border-radius:16px;border-color:rgba(233,214,168,.28);color:var(--ink)}
[data-cabin="suite"] .tabs{background:rgba(10,10,12,.86);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top-color:rgba(233,214,168,.2)}
[data-cabin="suite"] .id-card{background:linear-gradient(135deg,#221d14,#0e0d0b);color:var(--ink);box-shadow:inset 0 0 0 1px rgba(233,214,168,.5)}
[data-cabin="suite"] .sheet{background:#121215;border-top-color:#e9d6a8;border-radius:24px 24px 0 0}
[data-cabin="suite"] .profile{opacity:.5}
/* swipe hint on the answer card (ラウンジ・スイート) */
[data-cabin="lounge"] #sheetHost .sheet[role="status"] .sheet-in::after,
[data-cabin="suite"] #sheetHost .sheet[role="status"] .sheet-in::after{content:'← 左にスワイプしても次へ';display:block;text-align:center;font-size:11.5px;color:var(--ink2);margin-top:-2px}
</style>
