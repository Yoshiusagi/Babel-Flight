<style>
/* accounts (standalone site only) */
.acct-lead{font-size:13.5px;line-height:1.7}
.acct-go{margin-top:12px}
.acct-me{display:flex;align-items:center;gap:12px;margin-top:4px;min-width:0}
.acct-av{width:46px;height:46px;border-radius:50%;background:var(--bg);color:var(--ink);display:grid;place-items:center;flex:none}
.acct-av .pfp{font-size:24px;line-height:1}
.acct-av svg{width:24px;height:24px}
.acct-id{min-width:0;display:grid}
.acct-id b{font:700 19px/1.2 var(--f-disp);letter-spacing:.08em;text-transform:uppercase;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acct-id small{color:var(--ink2);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acct-sync{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink2);margin:12px 0 10px}
.acct-sync .dot{width:8px;height:8px;border-radius:50%;background:var(--line);flex:none}
.acct-sync .dot.ok{background:var(--good)}
.acct-sync .dot.sync{background:var(--info);animation:acctBlink 1s ease-in-out infinite}
.acct-sync .dot.off{background:#c9a227}
.acct-sync .dot.err{background:var(--bad)}
@keyframes acctBlink{50%{opacity:.25}}
.acct .row2 .ghost{flex:1}
.acct-del{display:block;margin:12px auto 0;background:none;border:0;color:var(--bad);font-size:13px;text-decoration:underline;text-underline-offset:3px;padding:6px}
.acct-pp{display:block;width:max-content;margin:6px auto 0;font-size:12px;color:var(--ink2)}
.acct-msg{margin-top:10px;font-size:13px;color:var(--good);font-weight:500}
.acct-ob{display:block;width:100%;margin-top:14px;padding:12px 14px;border:1.5px dashed var(--line);border-radius:10px;background:transparent;color:var(--ink2);font-size:13.5px;text-align:left;line-height:1.5}
.acct-ob b{color:var(--ink)}
.acct-g{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:13px 14px;border:1.5px solid #dadce0;border-radius:10px;background:#fff;color:#1f1f1f;font-weight:600;font-size:15px}
.acct-g svg{width:20px;height:20px;flex:none}
.acct-sheet button:disabled{opacity:.5;cursor:default}
.acct-sheet.busy{cursor:progress}
.acct-form{display:grid;gap:10px}
.acct-form .fld{display:grid;gap:4px;font-size:13px;color:var(--ink2)}
.acct-form input{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font:500 16px var(--f-body)}
.acct-form input:focus{outline:none;border-color:var(--ink);box-shadow:0 0 0 3px color-mix(in srgb,var(--ink) 12%,transparent)}
.acct-form .go{margin-top:2px}
.acct-err{min-height:1.2em;font-size:13px;color:var(--bad);margin:0;font-weight:500}
.acct-err:empty{min-height:0}
.acct-note{font-size:12.5px;color:var(--ink2);margin:0}
.acct-note:empty{display:none}
.acct-fine{font-size:12px;color:var(--ink2);text-align:center}
.acct-fine a{color:inherit}
.acct-link{background:none;border:0;color:var(--ink2);font-size:13px;text-decoration:underline;text-underline-offset:3px;padding:4px;justify-self:center}
.seg.two{grid-template-columns:repeat(2,1fr);margin-top:0}
.danger-go{background:var(--bad);color:#fff}
@media (prefers-reduced-motion:reduce){.acct-sync .dot.sync{animation:none}}
</style>
