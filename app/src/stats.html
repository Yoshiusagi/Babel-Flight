<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="same-origin">
<title>Babel Flight 管制塔</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=B612+Mono:wght@400;700&family=IBM+Plex+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* Owner-only usage dashboard for Babel Flight. Same terminal palette as the app;
   chart colors are the validated categorical slots 1-2 (checked against both surfaces). */
:root{
  color-scheme:light;
  --bg:#e9edf2; --surface:#ffffff; --surface2:#f2f5f9;
  --ink:#0b1626; --ink2:#46586d; --muted:#5f6e80; --line:#cbd5e0;
  --grid:#e6ebf1; --axis:#b4c0ce; --hl:rgba(11,22,38,.06);
  --s1:#2a78d6; --s2:#eb6834;
  --bad:#cf3342;
  --signal:#ffcf26; --on-signal:#1b1500;
  --board:#080a0f; --flap:#ffd23f; --board-edge:transparent;
  --edge:rgba(11,22,38,.06); --shadow:rgba(11,22,38,.22);
  --f-disp:'Barlow Condensed','IBM Plex Sans JP',system-ui,sans-serif;
  --f-body:'IBM Plex Sans JP','Hiragino Sans','Yu Gothic',system-ui,sans-serif;
  --f-mono:'B612 Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#060a12; --surface:#101828; --surface2:#16213a;
    --ink:#e8eefb; --ink2:#9aabc6; --muted:#8a9bb6; --line:#243350;
    --grid:#1c2740; --axis:#33425f; --hl:rgba(255,255,255,.06);
    --s1:#3987e5; --s2:#d95926;
    --bad:#ff7b86;
    --edge:rgba(255,255,255,.05); --shadow:rgba(0,0,0,.6); --board-edge:rgba(255,255,255,.1);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#060a12; --surface:#101828; --surface2:#16213a;
  --ink:#e8eefb; --ink2:#9aabc6; --muted:#8a9bb6; --line:#243350;
  --grid:#1c2740; --axis:#33425f; --hl:rgba(255,255,255,.06);
  --s1:#3987e5; --s2:#d95926;
  --bad:#ff7b86;
  --edge:rgba(255,255,255,.05); --shadow:rgba(0,0,0,.6); --board-edge:rgba(255,255,255,.1);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;overflow-x:clip;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
#app{max-width:780px;margin:0 auto;padding:max(14px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) 56px max(16px,env(safe-area-inset-left))}

.top{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.brand{display:flex;align-items:center;gap:10px;color:inherit;text-decoration:none;min-width:0}
.brand img{border-radius:9px;flex:none}
.brand b{display:block;font-family:var(--f-disp);font-size:21px;letter-spacing:.02em;line-height:1.05}
.brand small{display:block;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.12em;color:var(--muted)}
.ghost{margin-left:auto;background:transparent;border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-size:13px;cursor:pointer;color:var(--ink2)}
.ghost:hover{background:var(--surface)}
.loading,.msg{color:var(--ink2);text-align:center;margin-top:18vh}

.card{background:var(--surface);border-radius:18px;box-shadow:0 0 0 1px var(--edge),0 10px 26px -18px var(--shadow)}
.rv{animation:rvIn .5s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0) * 70ms)}
@keyframes rvIn{from{opacity:0;transform:translateY(12px)}}

/* gate */
.gate{max-width:420px;margin:7vh auto 0;padding:26px 22px 22px}
.gate-ic{display:block;border-radius:12px;margin-bottom:14px}
.gate h1{font-size:22px;margin:0 0 6px;line-height:1.3}
.lead{color:var(--ink2);font-size:14px;margin:0 0 18px}
.fld{display:block;margin-bottom:12px}
.fld span{display:block;font-size:13px;color:var(--ink2);margin-bottom:4px}
.fld input{width:100%;font:inherit;font-size:17px;padding:11px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface2);color:var(--ink)}
.fld input:focus{outline:none;border-color:var(--s1);box-shadow:0 0 0 3px color-mix(in srgb,var(--s1) 25%,transparent)}
.chk{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink2);margin:2px 0 4px;cursor:pointer;width:max-content}
.chk input{width:18px;height:18px;margin:0;accent-color:var(--s1)}
.err{min-height:1.5em;color:var(--bad);font-size:13.5px;margin:6px 0 10px;font-weight:500}
.go{width:100%;border:0;border-radius:14px;background:var(--signal);color:var(--on-signal);font-weight:700;font-size:16px;padding:13px;cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.2);transition:transform .08s,box-shadow .08s}
.go:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.2)}
.go:disabled{opacity:.6;cursor:progress}

/* hero board (stays dark in both themes, like the app's departure board) */
.board{background:var(--board);color:#e8eefb;border-radius:20px;padding:16px 18px 15px;box-shadow:0 0 0 1px var(--board-edge)}
.b-top{display:flex;justify-content:space-between;gap:8px;font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;color:#8ea0bd}
.b-main{display:flex;align-items:flex-end;justify-content:space-between;gap:10px 18px;margin-top:10px;flex-wrap:wrap}
.b-lbl{font-size:13px;color:#b9c6da}
.b-num{font-size:60px;font-weight:700;line-height:1;color:var(--flap);margin-top:6px}
.b-side{display:flex;gap:20px;margin:0}
.b-side dt{font-size:12px;color:#8ea0bd}
.b-side dd{margin:0;font-size:13px;color:#e8eefb}
.b-side dd b{font-size:24px;font-weight:700;margin-right:2px}
.b-delta{margin:12px 0 0;font-size:13px;color:#b9c6da}
.b-delta.up .ar{color:#3ddc84}.b-delta.down .ar{color:#ff7b86}

/* tiles */
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:10px}
.tile{padding:12px 14px}
.t-lbl{font-size:13px;color:var(--ink2);font-weight:500}
.t-lbl small{color:var(--muted);font-size:11.5px;font-weight:400;margin-left:6px}
.t-num{margin-top:2px;display:flex;align-items:baseline;gap:4px;flex-wrap:wrap}
.t-num b{font-size:28px;font-weight:700;line-height:1.15}
.t-num span{font-size:12px;color:var(--muted)}
.t-sub{margin:4px 0 0;font-size:12px;color:var(--ink2)}
@media (max-width:540px){
  .tiles{grid-template-columns:1fr;gap:8px}
  .tile{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;column-gap:12px;padding:11px 14px}
  .t-lbl{grid-column:1;grid-row:1}
  .t-num{grid-column:2;grid-row:1;margin:0;justify-content:flex-end}
  .t-sub{grid-column:1 / 3;grid-row:2;margin-top:2px}
}

/* filter row */
.filters{display:flex;align-items:center;gap:10px;margin:22px 0 12px;flex-wrap:wrap}
.flabel{font-size:13px;color:var(--ink2);font-weight:500}
.seg{display:inline-flex;background:var(--surface);border-radius:999px;padding:3px;box-shadow:inset 0 0 0 1px var(--line)}
.seg button{border:0;background:transparent;padding:7px 14px;border-radius:999px;font-size:13.5px;cursor:pointer;color:var(--ink2);font-weight:500;transition:background .2s,color .2s}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.upd{margin-left:auto;font-size:12px;color:var(--muted)}

/* chart cards */
.charts{display:grid;gap:12px;transition:opacity .2s}
.charts.busy{opacity:.5}
.pair{display:grid;gap:12px}
@media (min-width:720px){.pair{grid-template-columns:1fr 1fr}}
.fig{margin:0;padding:16px 16px 14px;min-width:0}
.fh{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.fh h2{margin:0;font-size:16px;font-weight:700;line-height:1.35}
.sub{margin:2px 0 0;font-size:12.5px;color:var(--muted)}
.tg{border:1px solid var(--line);background:transparent;border-radius:999px;padding:5px 11px;font-size:12px;color:var(--ink2);cursor:pointer;white-space:nowrap;flex:none}
.tg:hover{background:var(--surface2)}
.legend{display:flex;flex-wrap:wrap;gap:4px 16px;list-style:none;padding:0;margin:10px 0 0;font-size:12.5px;color:var(--ink2)}
.legend li{display:flex;align-items:center;gap:6px}
.sw{width:10px;height:10px;border-radius:3px;display:inline-block;flex:none}
.plot{position:relative;margin-top:8px}
.box svg{display:block;overflow:visible;touch-action:pan-y}
.grid{stroke:var(--grid);stroke-width:1}
.base{stroke:var(--axis);stroke-width:1}
.ytick,.xtick{fill:var(--muted);font-size:11px;font-family:var(--f-body);font-variant-numeric:tabular-nums}
.peak{fill:var(--ink2);font-size:11.5px;font-weight:700;font-family:var(--f-body)}
.hl{fill:var(--hl)}
.hit{fill:transparent;outline:none;-webkit-tap-highlight-color:transparent}
.anim .bar{transform-box:fill-box;transform-origin:50% 100%;animation:grow .6s cubic-bezier(.2,.8,.2,1) both}
@keyframes grow{from{transform:scaleY(0)}}
.empty{margin:14px 0 4px;padding:22px 14px;text-align:center;font-size:13.5px;color:var(--muted);border:1px dashed var(--line);border-radius:12px}
.single{padding:14px 2px 6px}
.single b{display:block;font-size:34px;font-weight:700;line-height:1.15}
.single span{color:var(--ink2);font-size:13px}

/* tooltip */
.tip{position:absolute;left:0;top:0;z-index:5;pointer-events:none;min-width:128px;padding:8px 10px;border-radius:10px;background:var(--surface);border:1px solid var(--line);box-shadow:0 12px 26px -12px var(--shadow);font-size:12px;opacity:0;transform:translate(-50%,calc(-100% - 10px));transition:opacity .12s;white-space:nowrap}
.tip.on{opacity:1}
.tt{color:var(--muted);font-size:11.5px;margin-bottom:3px}
.tr{display:flex;align-items:center;gap:6px;line-height:1.55}
.tr b{font-size:14px;color:var(--ink);font-variant-numeric:tabular-nums}
.tr span{color:var(--ink2)}
.key{width:12px;height:2px;border-radius:1px;flex:none}

/* horizontal bars (languages) */
.hb{display:grid;gap:2px;margin-top:6px}
.hb-row{display:grid;grid-template-columns:5.6em minmax(0,1fr);align-items:center;gap:10px;min-height:36px;border-radius:8px;padding:0 6px;outline:none;-webkit-tap-highlight-color:transparent}
.hb-row:hover,.hb-row:focus-visible,.hb-row.on{background:var(--hl)}
.hb-name{font-size:13.5px;color:var(--ink2)}
.hb-track{display:flex;align-items:center;gap:6px;min-width:0}
.hb-bar{display:block;flex:none;height:18px;width:calc((100% - 3.6em) * var(--p));min-width:2px;background:var(--s1);border-radius:0 4px 4px 0}
.hb-bar.z{display:none}
.hb-val{font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.hb.anim .hb-bar{transform-origin:0 50%;animation:growX .6s cubic-bezier(.2,.8,.2,1) both}
@keyframes growX{from{transform:scaleX(0)}}

/* split bar (modes) */
.split{display:flex;gap:2px;height:22px;margin-top:16px;border-radius:5px;overflow:hidden}
.sp{flex-basis:0;min-width:3px}
.split.anim{transform-origin:0 50%;animation:growX .7s cubic-bezier(.2,.8,.2,1) both}
.sleg{list-style:none;padding:0;margin:14px 0 0;display:grid;gap:10px}
.sleg li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;column-gap:8px;align-items:center;font-size:13.5px}
.sleg .sn{color:var(--ink)}
.sleg b{font-size:18px;font-weight:700;grid-row:1 / 3;grid-column:3}
.sleg small{grid-column:2;color:var(--muted);font-size:12px;line-height:1.3}

/* table view */
.tscroll{overflow-x:auto;margin-top:10px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:7px 8px;border-bottom:1px solid var(--grid);text-align:left;white-space:nowrap}
thead th{font-size:12px;color:var(--muted);font-weight:500}
tbody th{font-weight:500}
.num{text-align:right;font-variant-numeric:tabular-nums}

/* definitions */
.foot{margin-top:16px;padding:16px;border-radius:16px;border:1px solid var(--line);font-size:12.5px;color:var(--ink2)}
.foot h3{font-size:13px;margin:0 0 8px;color:var(--ink)}
.foot dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:6px 12px}
.foot dt{font-weight:700;color:var(--ink);white-space:nowrap}
.foot dd{margin:0}
.foot p{margin:10px 0 0}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <a class="brand" href="/" aria-label="Babel Flight のアプリを開く"><img src="/favicon.svg" alt="" width="34" height="34"><span><b>Babel Flight</b><small>管制塔 ・ CONTROL TOWER</small></span></a>
    <button id="logout" class="ghost" type="button" hidden>ログアウト</button>
  </header>
  <main id="main"><p class="loading">読み込み中…</p></main>
  <noscript><p class="msg">このページを見るには JavaScript をオンにしてね。</p></noscript>
</div>
<script>
(function(){
'use strict';
var main=document.getElementById('main'),logoutBtn=document.getElementById('logout');
var ST={range:'30d',data:null,anim:true,lastW:0};
var D={};
var reduce=false;try{reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;}catch(e){}
var LANG_JP={ko:'韓国語',en:'英語',es:'スペイン語',it:'イタリア語'},LANG_ORDER=['ko','en','es','it'];
var MODE_JP={daily:'日常会話モード',job:'職業モード'},MODE_ORDER=['daily','job'];
var RANGE_SUB={'30d':'直近30日 ・ 1日ごと','12m':'直近12か月 ・ 1か月ごと','all':'1年ごと'};
var RANGE_SHORT={'30d':'直近30日','12m':'直近12か月','all':'全期間'};
var WD='日月火水木金土';
var NS='http://www.w3.org/2000/svg';

/* ---------- helpers ---------- */
function h(tag,attrs,kids){
  var e=document.createElement(tag);
  if(attrs)for(var k in attrs){var v=attrs[k];if(v==null||v===false)continue;
    if(k==='class')e.className=v;else if(k==='text')e.textContent=v;else e.setAttribute(k,v===true?'':String(v));}
  (kids||[]).forEach(function(c){if(c==null)return;e.appendChild(typeof c==='string'?document.createTextNode(c):c);});
  return e;
}
function sv(tag,attrs){var e=document.createElementNS(NS,tag);if(attrs)for(var k in attrs)e.setAttribute(k,String(attrs[k]));return e;}
function fmt(n){return Number(n||0).toLocaleString('ja-JP');}
function compact(n){
  if(n>=100000000)return String(Math.round(n/10000000)/10).replace(/\.0$/,'')+'億';
  if(n>=10000)return String(Math.round(n/1000)/10).replace(/\.0$/,'')+'万';
  return fmt(n);
}
function cpLen(s){return Array.from(s).length;}
function parts(k){return {y:+k.slice(0,4),m:+k.slice(5,7),d:+k.slice(8,10)};}
function wd(k){var p=parts(k);return WD.charAt(new Date(Date.UTC(p.y,p.m-1,p.d)).getUTCDay());}
function shortLabel(k,unit){var p=parts(k);return unit==='day'?p.m+'/'+p.d:unit==='month'?p.m+'月':p.y+'年';}
function longLabel(k,unit){var p=parts(k);return unit==='day'?p.m+'月'+p.d+'日('+wd(k)+')':unit==='month'?p.y+'年'+p.m+'月':p.y+'年';}
function api(path,body){
  var o={credentials:'same-origin',cache:'no-store'};
  if(body!==undefined){o.method='POST';o.headers={'content-type':'application/json'};o.body=JSON.stringify(body);}
  return fetch(path,o).then(function(r){
    return r.json().catch(function(){return {};}).then(function(j){j=j&&typeof j==='object'?j:{};j._s=r.status;return j;});
  });
}
function countUp(el,to){
  if(reduce||to<2){el.textContent=fmt(to);return;}
  var t0=null,dur=Math.min(900,350+to*8);
  function step(t){if(t0===null)t0=t;var p=Math.min(1,(t-t0)/dur),e=1-Math.pow(1-p,3);el.textContent=fmt(Math.round(to*e));if(p<1)requestAnimationFrame(step);}
  el.textContent='0';requestAnimationFrame(step);
}
function niceTicks(max){
  if(max<=0)return [0,1];
  var raw=max/4,mag=Math.pow(10,Math.floor(Math.log10(raw))),n=raw/mag;
  var step=(n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*mag;
  step=Math.max(1,Math.ceil(step));
  var top=Math.ceil(max/step)*step,out=[];
  for(var v=0;v<=top;v+=step)out.push(v);
  return out;
}
function colPath(x,y,w,hh,r){
  if(r<=0)return 'M'+x+' '+(y+hh)+'V'+y+'H'+(x+w)+'V'+(y+hh)+'Z';
  return 'M'+x+' '+(y+hh)+'V'+(y+r)+'A'+r+' '+r+' 0 0 1 '+(x+r)+' '+y+'H'+(x+w-r)+'A'+r+' '+r+' 0 0 1 '+(x+w)+' '+(y+r)+'V'+(y+hh)+'Z';
}
function msg(text){logoutBtn.hidden=true;main.textContent='';main.appendChild(h('p',{class:'msg',text:text}));}

/* ---------- gate (setup / login) ---------- */
function passField(id,label,auto){
  var input=h('input',{id:id,type:'password',autocomplete:auto,maxlength:'64',spellcheck:'false',autocapitalize:'off'});
  return {wrap:h('label',{class:'fld',for:id},[h('span',{text:label}),input]),input:input};
}
function gate(title,lead,fields,btnText,submit,note){
  logoutBtn.hidden=true;
  main.textContent='';
  var err=h('p',{class:'err',role:'alert',text:note||''});
  var show=h('input',{type:'checkbox',id:'showpw'});
  show.addEventListener('change',function(){fields.forEach(function(f){f.input.type=show.checked?'text':'password';});});
  var btn=h('button',{class:'go',type:'submit',text:btnText});
  var form=h('form',{class:'gate card rv'},
    [h('img',{class:'gate-ic',src:'/favicon.svg',alt:'',width:'48',height:'48'}),h('h1',{text:title}),h('p',{class:'lead',text:lead})]
    .concat(fields.map(function(f){return f.wrap;}))
    .concat([h('label',{class:'chk',for:'showpw'},[show,h('span',{text:'合言葉を表示する'})]),err,btn]));
  form.noValidate=true;
  form.addEventListener('submit',function(e){
    e.preventDefault();
    if(btn.disabled)return;
    err.textContent='';btn.disabled=true;
    Promise.resolve().then(function(){return submit(err);})
      .catch(function(){err.textContent='通信できませんでした。電波を確認してね。';})
      .then(function(){btn.disabled=false;});
  });
  main.appendChild(form);
  setTimeout(function(){try{fields[0].input.focus();}catch(x){}},60);
}
function showSetup(note){
  var a=passField('pw1','合言葉(6〜64文字)','new-password'),b=passField('pw2','確認のためもう一度','new-password');
  gate('合言葉を決めよう','この集計ページはあなた専用。ここで決めた合言葉を知っている人だけが入れます。忘れないようにメモしておいてね。',[a,b],'決めて入る',function(err){
    var p=a.input.value;
    if(cpLen(p)<6||cpLen(p)>64){err.textContent='合言葉は6〜64文字で決めてね。';return;}
    if(p!==b.input.value){err.textContent='2回目の入力が1回目と違います。';return;}
    return api('/api/stats/setup',{pass:p}).then(function(j){
      if(j.ok){showDash();return;}
      if(j._s===409){showLogin('合言葉はもう決まっています。入力してね。');return;}
      err.textContent='うまくいきませんでした。もう一度試してね。';
    });
  },note);
}
function showLogin(note){
  var a=passField('pw1','合言葉','current-password');
  gate('管制塔に入る','Babel Flight がどれくらい使われているかを見るページです。合言葉を入れてね。',[a],'入る',function(err){
    var p=a.input.value;
    if(!p){err.textContent='合言葉を入れてね。';return;}
    return api('/api/stats/login',{pass:p}).then(function(j){
      if(j.ok){showDash();return;}
      if(j._s===429){err.textContent='間違いが続いたので、1時間ほど待ってからもう一度試してね。';return;}
      if(j._s===409){showSetup();return;}
      err.textContent=j._s===401?'合言葉が違います。':'うまくいきませんでした。もう一度試してね。';
      try{a.input.select();}catch(x){}
    });
  },note);
}
logoutBtn.addEventListener('click',function(){
  api('/api/stats/logout',{}).catch(function(){}).then(function(){showLogin('ログアウトしました。');});
});

/* ---------- dashboard ---------- */
function figure(id,title){
  var f={id:id,table:false,hl:null};
  f.sub=h('p',{class:'sub'});
  f.legend=h('ul',{class:'legend',hidden:true});
  f.box=h('div',{class:'box'});
  f.tip=h('div',{class:'tip','aria-hidden':'true'});
  f.tbl=h('div',{class:'tbl',hidden:true});
  var tg=h('button',{type:'button',class:'tg',text:'表で見る','aria-expanded':'false'});
  tg.addEventListener('click',function(){
    f.table=!f.table;hideTip(f);
    tg.textContent=f.table?'グラフで見る':'表で見る';tg.setAttribute('aria-expanded',String(f.table));
    f.plot.hidden=f.table;f.legend.hidden=f.table||!f.legend.childNodes.length;f.tbl.hidden=!f.table;
  });
  f.plot=h('div',{class:'plot'},[f.box,f.tip]);
  f.el=h('figure',{class:'card fig rv',id:'fig-'+id},[h('div',{class:'fh'},[h('div',null,[h('h2',{text:title}),f.sub]),tg]),f.legend,f.plot,f.tbl]);
  return f;
}
function showDash(){
  logoutBtn.hidden=false;
  main.textContent='';
  ST.data=null;ST.anim=true;
  D.hero=h('section',{class:'board rv','aria-label':'今日'});
  D.tiles=h('section',{class:'tiles rv',style:'--i:1','aria-label':'今月・今年・これまで'});
  var seg=h('div',{class:'seg',role:'group','aria-label':'期間'});
  [['30d','30日'],['12m','12か月'],['all','年別']].forEach(function(r){
    var b=h('button',{type:'button','aria-pressed':String(ST.range===r[0]),text:r[1]});
    b.addEventListener('click',function(){
      if(ST.range===r[0])return;
      ST.range=r[0];
      Array.prototype.forEach.call(seg.querySelectorAll('button'),function(x){x.setAttribute('aria-pressed',String(x===b));});
      ST.anim=true;load();
    });
    seg.appendChild(b);
  });
  D.updated=h('span',{class:'upd'});
  D.filters=h('div',{class:'filters rv',style:'--i:2'},[h('span',{class:'flabel',text:'期間'}),seg,D.updated]);
  D.visits=figure('visits','アクセス数');
  D.users=figure('users','ユーザー数(新規とリピーター)');
  D.langs=figure('langs','人気の言語');
  D.modes=figure('modes','人気のモード');
  D.visits.el.style.setProperty('--i','3');D.users.el.style.setProperty('--i','4');
  D.langs.el.style.setProperty('--i','5');D.modes.el.style.setProperty('--i','6');
  D.charts=h('div',{class:'charts'},[D.visits.el,D.users.el,h('div',{class:'pair'},[D.langs.el,D.modes.el])]);
  var foot=h('section',{class:'foot rv',style:'--i:7'},[
    h('h3',{text:'数え方'}),
    h('dl',null,[
      h('dt',{text:'アクセス'}),h('dd',{text:'アプリを開いた回数。30分以内の開き直しは同じ1回として数えます。'}),
      h('dt',{text:'ユーザー'}),h('dd',{text:'ブラウザ(端末)の数。同じ人でもスマホとパソコンなら2人になります。'}),
      h('dt',{text:'新規'}),h('dd',{text:'その日(月・年)に初めて来たブラウザ。前にも来たことがあればリピーター。'}),
      h('dt',{text:'言語・モード'}),h('dd',{text:'レッスン(通話シーンを含む)を始めた回数。モードはその時に選んでいたモードです。'})
    ]),
    h('p',{text:'日付は日本時間。名前やIPアドレスは保存していません。Claude で開いた版は数えていません。'})
  ]);
  [D.hero,D.tiles,D.filters,D.charts,foot].forEach(function(x){main.appendChild(x);});
  load();
}
var reqId=0;
function load(){
  var my=++reqId;
  D.charts.classList.add('busy');
  api('/api/stats/data?range='+ST.range).then(function(j){
    if(my!==reqId)return;
    if(j._s===401){showLogin('しばらく時間がたったので、もう一度合言葉を入れてね。');return;}
    if(!j.ok)throw new Error('bad');
    var first=!ST.data;
    ST.data=j;
    if(first){renderHero();renderTiles();}
    renderCharts();
    ST.anim=false;ST.lastW=main.clientWidth;
    D.charts.classList.remove('busy');
    var t=new Date();D.updated.textContent=t.getHours()+':'+String(t.getMinutes()).padStart(2,'0')+' 更新';
  }).catch(function(){
    if(my!==reqId)return;
    D.charts.classList.remove('busy');
    D.updated.textContent='読み込みに失敗しました';
  });
}
function renderHero(){
  var d=ST.data,k=d.kpi,t=k.today,diff=t.visits-k.yesterday.visits;
  D.hero.textContent='';
  D.hero.appendChild(h('div',{class:'b-top'},[h('span',{text:'TODAY'}),h('span',{text:longLabel(d.today,'day')+' ・ 日本時間'})]));
  var num=h('div',{class:'b-num',text:fmt(t.visits)});
  D.hero.appendChild(h('div',{class:'b-main'},[
    h('div',null,[h('div',{class:'b-lbl',text:'今日のアクセス'}),num]),
    h('dl',{class:'b-side'},[
      h('div',null,[h('dt',{text:'ユーザー'}),h('dd',null,[h('b',{text:fmt(t.users)}),'人'])]),
      h('div',null,[h('dt',{text:'うち新規'}),h('dd',null,[h('b',{text:fmt(t.newUsers)}),'人'])])
    ])
  ]));
  var cls=diff>0?'up':diff<0?'down':'flat';
  var txt=diff===0?'昨日と同じ(昨日 '+fmt(k.yesterday.visits)+')':'昨日より '+(diff>0?'+':'')+fmt(diff)+'(昨日 '+fmt(k.yesterday.visits)+')';
  D.hero.appendChild(h('p',{class:'b-delta '+cls},[h('span',{class:'ar','aria-hidden':'true',text:diff>0?'▲ ':diff<0?'▼ ':'— '}),txt]));
  countUp(num,t.visits);
}
function tile(label,small,value,sub){
  var b=h('b',{text:fmt(value)});
  var el=h('div',{class:'tile card'},[h('div',{class:'t-lbl'},[label,h('small',{text:small})]),h('div',{class:'t-num'},[b,h('span',{text:'アクセス'})]),h('p',{class:'t-sub',text:sub})]);
  countUp(b,value);
  return el;
}
function renderTiles(){
  var d=ST.data,k=d.kpi,today=d.today;
  var since=d.since?(d.since.slice(0,4)===today.slice(0,4)?shortLabel(d.since,'day'):d.since.replace(/-/g,'/'))+'から':'まだデータなし';
  D.tiles.textContent='';
  D.tiles.appendChild(tile('今月',(+today.slice(5,7))+'月',k.month.visits,'ユーザー '+fmt(k.month.users)+'人 ・ 新規 '+fmt(k.month.newUsers)+'人'));
  D.tiles.appendChild(tile('今年',today.slice(0,4)+'年',k.year.visits,'ユーザー '+fmt(k.year.users)+'人 ・ 新規 '+fmt(k.year.newUsers)+'人'));
  D.tiles.appendChild(tile('これまで',since,k.total.visits,'ユーザー '+fmt(k.total.users)+'人 ・ レッスン '+fmt(k.total.lessons)+'回'));
}
function rangeSpan(){
  var d=ST.data,s=d.series;if(!s.length)return '';
  var a=s[0].k,b=s[s.length-1].k;
  if(a===b)return '';
  if(d.unit==='day')return '(' +shortLabel(a,'day')+'〜'+shortLabel(b,'day')+')';
  if(d.unit==='month')return '('+longLabel(a,'month')+'〜'+longLabel(b,'month')+')';
  return '('+a+'年〜'+b+'年)';
}
function setLegend(f,items){
  f.legend.textContent='';
  items.forEach(function(it){f.legend.appendChild(h('li',null,[h('i',{class:'sw',style:'background:var('+it[0]+')'}),h('span',{text:it[1]})]));});
  f.legend.hidden=f.table||!items.length;
}
function table(f,head,rows){
  f.tbl.textContent='';
  var t=h('table'),tr=h('tr');
  head.forEach(function(x,i){tr.appendChild(h('th',{scope:'col',class:i?'num':null,text:x}));});
  t.appendChild(h('thead',null,[tr]));
  var tb=h('tbody');
  rows.forEach(function(r){var row=h('tr');r.forEach(function(c,i){row.appendChild(h(i?'td':'th',{class:i?'num':null,scope:i?null:'row',text:c}));});tb.appendChild(row);});
  t.appendChild(tb);
  f.tbl.appendChild(h('div',{class:'tscroll'},[t]));
}
function empty(text){return h('p',{class:'empty',text:text});}

/* tooltip */
function showTip(f,x,y,w,title,rows){
  var t=f.tip;t.textContent='';
  t.appendChild(h('div',{class:'tt',text:title}));
  rows.forEach(function(r){
    t.appendChild(h('div',{class:'tr'},[h('i',{class:'key',style:r[0]?'background:var('+r[0]+')':'visibility:hidden'}),h('b',{text:r[1]}),h('span',{text:r[2]})]));
  });
  t.classList.add('on');
  var tw=t.offsetWidth||140,left=Math.max(tw/2,Math.min(w-tw/2,x));
  t.style.left=left+'px';t.style.top=y+'px';
}
function hideTip(f){
  if(!f)return;
  f.tip.classList.remove('on');
  if(f.hl)f.hl.setAttribute('x','-999');
  Array.prototype.forEach.call(f.box.querySelectorAll('.hb-row.on'),function(r){r.classList.remove('on');});
}
function wire(el,show,hide){
  el.addEventListener('pointerenter',function(e){if(e.pointerType==='mouse')show();});
  el.addEventListener('pointerleave',function(e){if(e.pointerType==='mouse')hide();});
  el.addEventListener('pointerdown',function(e){if(e.pointerType!=='mouse')show();});
  el.addEventListener('focus',show);
  el.addEventListener('blur',hide);
}
document.addEventListener('pointerdown',function(e){
  var t=e.target;if(t&&t.closest&&t.closest('.hit,.hb-row'))return;
  [D.visits,D.users,D.langs,D.modes].forEach(hideTip);
});

/* column chart (single or stacked) */
function columnChart(f,o){
  var box=f.box;box.textContent='';hideTip(f);f.hl=null;
  var n=o.keys.length;
  var totals=o.keys.map(function(_,i){return o.series.reduce(function(a,se){return a+(se.values[i]||0);},0);});
  var max=Math.max.apply(null,totals.concat([0]));
  if(max===0){box.appendChild(empty('この期間のデータはまだありません。アプリが開かれると、ここにグラフが出てきます。'));return;}
  if(n===1){var sg=o.single();box.appendChild(h('div',{class:'single'},[h('b',{text:sg[0]}),h('span',{text:sg[1]})]));return;}
  var W=Math.max(240,Math.floor(box.clientWidth||300)),H=212;
  var ticks=niceTicks(max),top=ticks[ticks.length-1];
  var m={t:24,r:10,b:26,l:Math.max(22,10+7*compact(top).length)};
  var pw=W-m.l-m.r,ph=H-m.t-m.b,band=pw/n,bw=Math.min(24,Math.max(3,band*0.64));
  function Y(v){return m.t+ph-(v/top)*ph;}
  var svg=sv('svg',{width:W,height:H,viewBox:'0 0 '+W+' '+H,role:'img','aria-label':o.aria+'。数値は「表で見る」で確認できます。'});
  if(ST.anim&&!reduce)svg.setAttribute('class','anim');
  ticks.forEach(function(t){
    var y=Math.round(Y(t))+0.5;
    if(t>0)svg.appendChild(sv('line',{x1:m.l,x2:W-m.r,y1:y,y2:y,class:'grid'}));
    var tx=sv('text',{x:m.l-6,y:y+3.5,'text-anchor':'end',class:'ytick'});tx.textContent=compact(t);svg.appendChild(tx);
  });
  var hl=sv('rect',{class:'hl',x:-999,y:m.t-8,width:band,height:ph+8,rx:4});svg.appendChild(hl);f.hl=hl;
  var g=sv('g');svg.appendChild(g);
  var every=Math.max(1,Math.ceil(n/Math.max(2,Math.floor(pw/46))));
  o.keys.forEach(function(k,i){
    var cx=m.l+band*i+band/2,x=cx-bw/2,acc=0,first=true,nz=[];
    o.series.forEach(function(se,j){if(se.values[i]>0)nz.push(j);});
    var topJ=nz.length?nz[nz.length-1]:-1;
    o.series.forEach(function(se,j){
      var v=se.values[i];if(!(v>0))return;
      var y0=Y(acc);acc+=v;var y1=Y(acc);
      var gap=first?0:2;first=false;
      var hh=Math.max(1.5,y0-y1-gap),r=j===topJ?Math.min(4,bw/2,hh):0;
      g.appendChild(sv('path',{d:colPath(x,y0-gap-hh,bw,hh,r),class:'bar',style:'fill:var('+se.color+');animation-delay:'+(i*12+j*110)+'ms'}));
    });
    if((n-1-i)%every===0){
      var lab=shortLabel(k,o.unit),lw=lab.length*6.4,anchor='middle',lx=cx;
      if(cx+lw/2>W){anchor='end';lx=W;}else if(cx-lw/2<m.l-4){anchor='start';lx=Math.max(0,cx-band/2);}
      var tx=sv('text',{x:lx,y:H-7,'text-anchor':anchor,class:'xtick'});tx.textContent=lab;svg.appendChild(tx);
    }
  });
  var by=Math.round(Y(0))+0.5;
  svg.appendChild(sv('line',{x1:m.l,x2:W-m.r,y1:by,y2:by,class:'base'}));
  if(o.peak){
    var pi=totals.indexOf(max),px=m.l+band*pi+band/2;
    var pt=sv('text',{x:Math.max(m.l+8,Math.min(W-12,px)),y:Y(max)-7,'text-anchor':'middle',class:'peak'});pt.textContent=fmt(max);svg.appendChild(pt);
  }
  o.keys.forEach(function(k,i){
    var rows=o.tip(i),title=longLabel(k,o.unit);
    var hit=sv('rect',{x:m.l+band*i,y:0,width:band,height:H,class:'hit',tabindex:'0',role:'img','aria-label':title+' '+rows.map(function(r){return r[2]+' '+r[1];}).join('、')});
    wire(hit,function(){hl.setAttribute('x',String(m.l+band*i));showTip(f,m.l+band*i+band/2,Y(totals[i]),W,title,rows);},function(){hideTip(f);});
    svg.appendChild(hit);
  });
  box.appendChild(svg);
}
function renderVisits(){
  var d=ST.data,f=D.visits,s=d.series;
  f.sub.textContent=RANGE_SUB[d.range]+rangeSpan();
  setLegend(f,[]);
  columnChart(f,{
    keys:s.map(function(p){return p.k;}),unit:d.unit,aria:'アクセス数の推移',peak:true,
    series:[{color:'--s1',values:s.map(function(p){return p.visits;})}],
    tip:function(i){return [['--s1',fmt(s[i].visits)+'回','アクセス'],[null,fmt(s[i].users)+'人','ユーザー']];},
    single:function(){return [fmt(s[0].visits)+'回','アクセス('+longLabel(s[0].k,d.unit)+')'];}
  });
  table(f,['期間','アクセス','ユーザー','レッスン'],s.slice().reverse().map(function(p){return [longLabel(p.k,d.unit),fmt(p.visits),fmt(p.users),fmt(p.lessons)];}));
}
function renderUsers(){
  var d=ST.data,f=D.users,s=d.series;
  f.sub.textContent=RANGE_SUB[d.range]+rangeSpan();
  setLegend(f,[['--s2','リピーター(上)'],['--s1','新規(下)']]);
  columnChart(f,{
    keys:s.map(function(p){return p.k;}),unit:d.unit,aria:'ユーザー数の推移(新規とリピーター)',peak:true,
    series:[{color:'--s1',values:s.map(function(p){return p.newUsers;})},{color:'--s2',values:s.map(function(p){return p.returning;})}],
    tip:function(i){return [['--s2',fmt(s[i].returning)+'人','リピーター'],['--s1',fmt(s[i].newUsers)+'人','新規'],[null,fmt(s[i].users)+'人','合計']];},
    single:function(){return [fmt(s[0].users)+'人','新規 '+fmt(s[0].newUsers)+'人 ・ リピーター '+fmt(s[0].returning)+'人('+longLabel(s[0].k,d.unit)+')'];}
  });
  table(f,['期間','ユーザー','新規','リピーター'],s.slice().reverse().map(function(p){return [longLabel(p.k,d.unit),fmt(p.users),fmt(p.newUsers),fmt(p.returning)];}));
}
function renderLangs(){
  var d=ST.data,f=D.langs,map={};
  d.langs.forEach(function(r){map[r.k]=r;});
  var rows=LANG_ORDER.map(function(k){var r=map[k]||{n:0,u:0};return {k:k,name:LANG_JP[k],n:r.n,u:r.u};})
    .sort(function(a,b){return b.n-a.n||LANG_ORDER.indexOf(a.k)-LANG_ORDER.indexOf(b.k);});
  f.sub.textContent='始めたレッスンの回数 ・ '+RANGE_SHORT[d.range];
  table(f,['言語','レッスン','ユーザー'],rows.map(function(r){return [r.name,fmt(r.n)+'回',fmt(r.u)+'人'];}));
  var box=f.box;box.textContent='';hideTip(f);
  var max=Math.max.apply(null,rows.map(function(r){return r.n;}).concat([0]));
  if(!max){box.appendChild(empty('この期間にはまだレッスンがありません。'));return;}
  var list=h('div',{class:'hb'+(ST.anim&&!reduce?' anim':'')});
  rows.forEach(function(r,i){
    var bar=h('span',{class:'hb-bar'+(r.n?'':' z'),style:'--p:'+(r.n/max)+';animation-delay:'+(i*80)+'ms'});
    var row=h('div',{class:'hb-row',tabindex:'0',role:'img','aria-label':r.name+' レッスン'+r.n+'回 ユーザー'+r.u+'人'},
      [h('span',{class:'hb-name',text:r.name}),h('span',{class:'hb-track'},[bar,h('span',{class:'hb-val',text:fmt(r.n)})])]);
    wire(row,function(){
      hideTip(f);row.classList.add('on');
      var pr=f.plot.getBoundingClientRect(),br=(r.n?bar:row).getBoundingClientRect();
      showTip(f,(r.n?br.right:br.left+60)-pr.left,br.top-pr.top,pr.width,r.name,[['--s1',fmt(r.n)+'回','レッスン'],[null,fmt(r.u)+'人','ユーザー']]);
    },function(){hideTip(f);});
    list.appendChild(row);
  });
  box.appendChild(list);
}
function renderModes(){
  var d=ST.data,f=D.modes,map={};
  d.modes.forEach(function(r){map[r.k]=r;});
  var rows=MODE_ORDER.map(function(k,i){var r=map[k]||{n:0,u:0};return {k:k,name:MODE_JP[k],n:r.n,u:r.u,color:i?'--s2':'--s1'};});
  var total=rows[0].n+rows[1].n;
  f.sub.textContent='始めたレッスンの回数 ・ '+RANGE_SHORT[d.range];
  var p0=total?Math.round(rows[0].n/total*100):0,pct=[p0,total?100-p0:0];
  table(f,['モード','レッスン','割合','ユーザー'],rows.map(function(r,i){return [r.name,fmt(r.n)+'回',pct[i]+'%',fmt(r.u)+'人'];}));
  var box=f.box;box.textContent='';hideTip(f);
  if(!total){box.appendChild(empty('この期間にはまだレッスンがありません。'));return;}
  var bar=h('div',{class:'split'+(ST.anim&&!reduce?' anim':''),role:'img','aria-label':rows.map(function(r,i){return r.name+' '+pct[i]+'%';}).join('、')});
  rows.forEach(function(r){if(r.n)bar.appendChild(h('span',{class:'sp',style:'flex-grow:'+r.n+';background:var('+r.color+')'}));});
  var leg=h('ul',{class:'sleg'});
  rows.forEach(function(r,i){
    leg.appendChild(h('li',null,[h('i',{class:'sw',style:'background:var('+r.color+')'}),h('span',{class:'sn',text:r.name}),h('b',{text:pct[i]+'%'}),h('small',{text:fmt(r.n)+'回 ・ '+fmt(r.u)+'人'})]));
  });
  box.appendChild(bar);box.appendChild(leg);
}
function renderCharts(){renderVisits();renderUsers();renderLangs();renderModes();}
var rT=0;
window.addEventListener('resize',function(){
  clearTimeout(rT);
  rT=setTimeout(function(){
    if(!ST.data||!D.charts||!document.body.contains(D.charts))return;
    var w=main.clientWidth;if(w===ST.lastW)return;
    ST.lastW=w;ST.anim=false;renderCharts();
  },140);
});

/* ---------- boot ---------- */
api('/api/stats/state').then(function(j){
  if(j._s===503){msg('データベースを準備しています。数分たってから開き直してね。');return;}
  if(j._s!==200){msg('うまく読み込めませんでした。開き直してみてね。');return;}
  if(!j.configured)showSetup();else if(!j.authed)showLogin();else showDash();
}).catch(function(){msg('通信できませんでした。電波を確認してね。');});
})();
</script>
