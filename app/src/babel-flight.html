<style>
/* Layout: phone-first single column. Gate (route + boarding pass + departures list), Connection (review), Passport (stamps), and a Flight screen built around a split-flap board.
   Palette: day terminal (cool grey, navy ink, signal yellow) and night cabin. The board and LED strip stay dark in both themes, like real hardware. */
:root{
  --bg:#e9edf2; --bg2:#dde3ea; --surface:#ffffff; --surface2:#f2f5f9;
  --ink:#0b1626; --ink2:#46586d; --line:#cbd5e0;
  --signal:#ffcf26; --on-signal:#1b1500;
  --good:#0f8a52; --bad:#cf3342; --info:#2563eb;
  --shadow:rgba(11,22,38,.16);
  --board:#080a0f; --flap:#ffd23f; --led:#ff9f2e;
  --c-ko:#e8505b; --c-en:#2d6bff; --c-es:#f08a1c; --c-it:#17a068;
  --lc:var(--c-ko);
  --f-disp:'Barlow Condensed','IBM Plex Sans JP',system-ui,sans-serif;
  --f-body:'IBM Plex Sans JP','Hiragino Sans','Yu Gothic',system-ui,sans-serif;
  --f-mono:'B612 Mono','Noto Sans KR',ui-monospace,Menlo,Consolas,monospace;
  --f-dot:'DotGothic16','IBM Plex Sans JP','Hiragino Sans',sans-serif;
  --f-ko:'Noto Sans KR','IBM Plex Sans JP',sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#060a12; --bg2:#0b111d; --surface:#101828; --surface2:#16213a;
  --ink:#e8eefb; --ink2:#9aabc6; --line:#243350;
  --good:#45d68c; --bad:#ff6b79; --info:#7ba6ff; --shadow:rgba(0,0,0,.55);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#060a12; --bg2:#0b111d; --surface:#101828; --surface2:#16213a;
  --ink:#e8eefb; --ink2:#9aabc6; --line:#243350;
  --good:#45d68c; --bad:#ff6b79; --info:#7ba6ff; --shadow:rgba(0,0,0,.55);
  color-scheme:dark}
body{
  background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0;-webkit-tap-highlight-color:transparent;
}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--info);outline-offset:2px}
h1,h2,h3,p{margin:0}
#app{max-width:520px;margin:0 auto;padding-block:14px 104px;min-width:0}
body{overflow-x:clip}
.mono{font-family:var(--f-mono)}
.lbl{font:700 10.5px/1 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--ink2)}
.dim{color:var(--ink2)}
.ko{font-family:var(--f-ko)}
svg{display:block}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-bottom:12px;border-bottom:2px dashed var(--signal)}
.brand{display:flex;align-items:center;gap:8px;font:700 22px/1 var(--f-disp);letter-spacing:.12em;text-transform:uppercase}
.brand svg{width:26px;height:26px;color:var(--ink)}
.brand b{background:var(--signal);color:var(--on-signal);padding:2px 6px 1px;font-weight:700}
.stats-top{display:flex;gap:8px;min-width:0}
.pill{display:flex;flex-direction:column;align-items:flex-end;gap:3px;min-width:0}
.pill .v{font:700 15px/1 var(--f-mono);font-variant-numeric:tabular-nums}

/* destination chips */
.dests{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
.dest{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:9px 10px 8px;border:1.5px solid var(--line);background:var(--surface);border-radius:8px;text-align:left;position:relative;overflow:hidden;min-width:0}
.dest::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--dc)}
.dest .code{font:700 17px/1 var(--f-mono);letter-spacing:.04em;padding-left:4px}
.dest .nm{font-size:11px;color:var(--ink2);padding-left:4px;white-space:nowrap}
.dest[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.dest[aria-pressed="true"] .nm{color:var(--bg);opacity:.75}

/* card */
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;margin-top:14px;min-width:0}
.card-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:8px}
.card-h h2{font:700 18px/1.1 var(--f-disp);letter-spacing:.08em;text-transform:uppercase}
.route svg{width:100%;height:auto;overflow:visible}
.rstats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:6px}
.rstats>div{border-left:3px solid var(--lc);padding-left:8px;min-width:0}
.rstats .v{font:700 17px/1.1 var(--f-mono);font-variant-numeric:tabular-nums;margin-top:4px}
.rstats .u{font-size:11px;color:var(--ink2);margin-left:2px;font-weight:400}

/* boarding pass */
.pass{margin-top:14px;filter:drop-shadow(0 1px 0 var(--line)) drop-shadow(0 10px 14px var(--shadow))}
.pass-main,.pass-stub{background:var(--surface);position:relative}
.pass-main{border-radius:14px 14px 0 0;padding:14px 16px 16px;
  -webkit-mask:radial-gradient(circle 11px at 0 100%,#0000 97%,#000) left/51% 100% no-repeat,radial-gradient(circle 11px at 100% 100%,#0000 97%,#000) right/51% 100% no-repeat;
  mask:radial-gradient(circle 11px at 0 100%,#0000 97%,#000) left/51% 100% no-repeat,radial-gradient(circle 11px at 100% 100%,#0000 97%,#000) right/51% 100% no-repeat}
.pass-main::before{content:"";position:absolute;left:0;right:0;top:0;height:6px;background:var(--lc);border-radius:14px 14px 0 0}
.pass-stub{border-radius:0 0 14px 14px;padding:16px;
  -webkit-mask:radial-gradient(circle 11px at 0 0,#0000 97%,#000) left/51% 100% no-repeat,radial-gradient(circle 11px at 100% 0,#0000 97%,#000) right/51% 100% no-repeat;
  mask:radial-gradient(circle 11px at 0 0,#0000 97%,#000) left/51% 100% no-repeat,radial-gradient(circle 11px at 100% 0,#0000 97%,#000) right/51% 100% no-repeat}
.pass-stub::before{content:"";position:absolute;left:14px;right:14px;top:0;border-top:2px dashed var(--line)}
.pass-route{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:6px}
.pass-route .ap{font:700 40px/1 var(--f-disp);letter-spacing:.04em}
.pass-route .ap small{display:block;font:400 11px/1.4 var(--f-body);letter-spacing:0;color:var(--ink2)}
.pass-route .ap:last-child{text-align:right}
.pass-route svg{flex:1;min-width:30px;height:24px;color:var(--lc)}
.pass-title{font:700 22px/1.2 var(--f-body);margin-top:12px}
.pass-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.pass-grid .v{font:700 15px/1.2 var(--f-mono);margin-top:4px;font-variant-numeric:tabular-nums}
.stub-row{display:flex;align-items:center;gap:14px}
.barcode{flex:1;height:44px;min-width:0;color:var(--ink)}
.barcode svg{width:100%;height:100%}
.go{display:block;width:100%;margin-top:14px;padding:15px 16px;border:0;border-radius:10px;background:var(--signal);color:var(--on-signal);font:700 18px/1 var(--f-disp);letter-spacing:.14em;text-transform:uppercase;box-shadow:0 0 0 1px rgba(0,0,0,.12) inset,0 8px 18px -10px var(--signal)}
.go small{display:block;font:500 11px/1.3 var(--f-body);letter-spacing:.04em;text-transform:none;margin-top:5px;opacity:.75}
.go:active{transform:translateY(1px)}
.go:disabled{opacity:.45;cursor:not-allowed}
.ghost{background:transparent;border:1.5px solid var(--line);border-radius:10px;padding:11px 14px;font-weight:500}

/* departures list */
.dep{margin-top:14px;background:var(--board);color:var(--flap);border-radius:12px;padding:6px 0 4px;box-shadow:inset 0 0 0 1px #262c38}
.dep-h{display:flex;justify-content:space-between;padding:10px 14px 8px;font:700 11px var(--f-mono);letter-spacing:.14em;color:#8a8f9c;text-transform:uppercase}
.dep-row{display:grid;grid-template-columns:50px minmax(0,1fr) 30px 78px;gap:6px;align-items:center;width:100%;padding:11px 14px;border:0;border-top:1px solid #1d222c;background:transparent;text-align:left;color:inherit;font-family:var(--f-mono)}
.dep-row .fn{font-size:12px;font-weight:700;color:#c9ccd4}
.dep-row .nm{font:700 14px/1.3 var(--f-body);color:#f2f4f8;min-width:0}
.dep-row .nm small{display:block;font:400 10.5px var(--f-mono);color:#7f8593;letter-spacing:.06em}
.dep-row .gt{font-size:13px;font-weight:700}
.dep-row .st{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-align:right}
.dep-row[aria-pressed="true"]{background:#141923;box-shadow:inset 3px 0 0 var(--lc)}
.st.arrived{color:#58e3a0}.st.boarding{color:var(--flap)}.st.delayed{color:#ff7b86}.st.sched{color:#8a8f9c}
.st.boarding i{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--flap);margin-right:5px;animation:blink 1.2s steps(2,end) infinite}
@keyframes blink{50%{opacity:.15}}
.mbar{height:3px;background:#222834;margin-top:5px;border-radius:2px;overflow:hidden}
.mbar i{display:block;height:100%;background:var(--lc)}

/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding:6px max(16px,env(safe-area-inset-left,0px)) calc(6px + env(safe-area-inset-bottom,0px))}
.tabs-in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.tab{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 4px 6px;border:0;background:transparent;color:var(--ink2);font:500 11px/1.2 var(--f-body);border-radius:8px}
.tab svg{width:24px;height:24px}
.tab[aria-current="page"]{color:var(--ink)}
.tab[aria-current="page"]::before{content:"";position:absolute;top:-7px;left:50%;width:22px;height:4px;margin-left:-11px;border-radius:0 0 4px 4px;background:var(--signal);box-shadow:0 0 10px var(--signal)}
.badge{position:absolute;top:2px;left:calc(50% + 6px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--bad);color:#fff;font:700 10.5px/18px var(--f-mono);text-align:center}

/* connection */
.big-count{display:flex;align-items:center;gap:14px}
.due-board{background:var(--board);color:var(--flap);font:700 40px/1 var(--f-mono);padding:12px 16px;border-radius:8px;letter-spacing:.06em;font-variant-numeric:tabular-nums;box-shadow:inset 0 0 0 1px #262c38}
.ladder{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin-top:10px;text-align:center}
.ladder div{border-top:3px solid var(--line);padding-top:6px;font:700 12px var(--f-mono)}
.ladder div small{display:block;font:400 10px var(--f-body);color:var(--ink2);margin-top:2px}
.ladder .on{border-color:var(--lc)}
.unit-mastery{display:grid;gap:10px;margin-top:6px}
.um{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;font-size:13px}
.um .bar{grid-column:1/3;height:6px;background:var(--bg2);border-radius:3px;overflow:hidden}
.um .bar i{display:block;height:100%;background:var(--lc);border-radius:3px}
.explain p{font-size:13.5px;color:var(--ink2);margin-top:8px}
.explain p b{color:var(--ink)}

/* passport */
.id-card{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;background:var(--ink);color:var(--bg);border-radius:14px;padding:16px;margin-top:14px;position:relative;overflow:hidden}
.id-card::after{content:"";position:absolute;right:-30px;top:-30px;width:140px;height:140px;border-radius:50%;border:18px solid rgba(255,207,38,.14)}
.photo{width:64px;height:78px;border-radius:6px;background:var(--bg);color:var(--ink);display:grid;place-items:center}
.photo svg{width:38px;height:38px}
.id-card .lbl{color:var(--bg);opacity:.65}
.id-card input{width:100%;background:transparent;border:0;border-bottom:1px dashed rgba(255,255,255,.4);color:var(--bg);font:700 26px/1.2 var(--f-disp);letter-spacing:.1em;text-transform:uppercase;padding:2px 0;border-radius:0}
.id-card .cls{margin-top:8px;font:700 13px var(--f-mono);letter-spacing:.06em;color:var(--signal)}
.cls-bar{height:4px;background:rgba(255,255,255,.2);border-radius:2px;margin-top:8px;overflow:hidden}
.cls-bar i{display:block;height:100%;background:var(--signal)}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0}
.kpi .v{font:700 20px/1.1 var(--f-mono);margin-top:6px;font-variant-numeric:tabular-nums}
.stamps{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.slot{aspect-ratio:1;border:1.5px dashed var(--line);border-radius:8px;display:grid;place-items:center;position:relative;overflow:hidden;min-width:0}
.slot svg{width:100%;height:100%}
.slot.empty{color:var(--ink2);font:700 10px var(--f-mono);letter-spacing:.1em;text-align:center;padding:6px}
.slot.got{border-style:solid;border-color:transparent;background:var(--surface2)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
.seg button{padding:10px 6px;border:1.5px solid var(--line);background:var(--surface);border-radius:8px;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:12px}
.danger{color:var(--bad);border-color:var(--bad)}

/* flight */
.fl-top{display:flex;align-items:center;gap:10px}
.x{width:38px;height:38px;border:1.5px solid var(--line);background:var(--surface);border-radius:10px;display:grid;place-items:center;flex:none}
.x svg{width:18px;height:18px}
.fl-id{flex:1;min-width:0}
.fl-id b{display:block;font:700 15px/1.2 var(--f-body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.turb{font:700 11px var(--f-mono);letter-spacing:.06em;padding:6px 8px;border-radius:6px;background:var(--surface);border:1px solid var(--line);flex:none}
.turb.hot{color:var(--bad);border-color:var(--bad)}
.profile{margin-top:10px}
.profile svg{width:100%;height:auto;overflow:visible}
.phase{display:flex;justify-content:space-between;font:700 11px var(--f-mono);letter-spacing:.12em;color:var(--ink2);margin-top:2px}
.board{container-type:inline-size;margin-top:12px;background:linear-gradient(#1c212c,#0b0e14);padding:10px;border-radius:12px;box-shadow:inset 0 0 0 1px #2c3340,0 14px 26px -16px var(--shadow);min-height:132px}
.bgrid{display:flex;flex-direction:column;gap:2px}
.brow{display:grid;grid-template-columns:repeat(var(--cols),minmax(0,1fr));gap:2px}
.cell{position:relative;aspect-ratio:3/4.1;perspective:260px;color:var(--flap);font-family:var(--f-mono);font-weight:700;font-size:calc(100cqw / var(--cols) * .6)}
.cell .h,.cell .f{position:absolute;left:0;right:0;height:50%;overflow:hidden;background:#171b24;backface-visibility:hidden}
.cell .t{top:0;border-radius:3px 3px 0 0}
.cell .b{bottom:0;border-radius:0 0 3px 3px;background:#12151c}
.cell .h span,.cell .f span{position:absolute;left:0;right:0;height:200%;display:flex;align-items:center;justify-content:center;line-height:1}
.cell .t span{top:0}.cell .b span{bottom:0}
.cell .f{z-index:2;visibility:hidden}
.cell .ft{top:0;transform-origin:50% 100%;border-radius:3px 3px 0 0}
.cell .fb{bottom:0;transform-origin:50% 0;background:#12151c;border-radius:0 0 3px 3px}
.cell::after{content:"";position:absolute;left:0;right:0;top:calc(50% - 1px);height:2px;background:#05070a;z-index:3}
.led{margin-top:10px;background:#090b0f;border-radius:8px;padding:12px 14px;min-height:62px;box-shadow:inset 0 0 0 1px #20252f}
.led .m{font:400 19px/1.4 var(--f-dot);color:var(--led);text-shadow:0 0 8px rgba(255,159,46,.55)}
.led .s{font:400 13px/1.4 var(--f-dot);color:#b36d1c;margin-top:2px}
.q{margin-top:14px;display:flex;flex-direction:column;gap:10px}
.qh{font:700 12px var(--f-mono);letter-spacing:.12em;color:var(--ink2);text-transform:uppercase}
.opts{display:grid;gap:8px}
.opt{display:block;width:100%;text-align:left;padding:14px;border:1.5px solid var(--line);background:var(--surface);border-radius:10px;font-size:15.5px;line-height:1.4;min-height:52px}
.opt.ko{font-family:var(--f-ko);font-weight:500}
.opt:active{transform:scale(.99)}
.opt.ok{border-color:var(--good);background:color-mix(in srgb,var(--good) 14%,var(--surface))}
.opt.no{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--surface))}
.opt.off{opacity:.55}
.row2{display:flex;gap:8px}
.sq{display:flex;align-items:center;justify-content:center;gap:6px;padding:11px 14px;border:1.5px solid var(--line);background:var(--surface);border-radius:10px;font-size:13.5px}
.sq svg{width:20px;height:20px}
.sq.big{flex:1;padding:16px;font-weight:700}
.note{font-size:13.5px;line-height:1.6;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--signal);border-radius:8px;padding:10px 12px}
.note b{display:block;font:700 10.5px var(--f-mono);letter-spacing:.12em;color:var(--ink2);margin-bottom:3px}
.tray{min-height:62px;border-bottom:2px dashed var(--line);display:flex;flex-wrap:wrap;gap:6px;padding:6px 0 8px;align-content:flex-start}
.bank{display:flex;flex-wrap:wrap;gap:8px;min-height:50px}
.tile{position:relative;padding:11px 14px 11px 24px;border:1.5px solid var(--line);background:var(--surface);border-radius:8px;font-size:16px;line-height:1.2;box-shadow:0 2px 0 var(--line)}
.tile::before{content:"";position:absolute;left:8px;top:50%;width:7px;height:7px;margin-top:-3.5px;border-radius:50%;background:var(--bg2);box-shadow:inset 0 0 0 1.5px var(--line)}
.tile.ko{font-family:var(--f-ko);font-weight:500}
.tile.used{visibility:hidden}
.typebox{width:100%;padding:14px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font:500 17px var(--f-mono)}
.skel{font:400 13px var(--f-mono);letter-spacing:.14em;color:var(--ink2);word-break:break-all}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:14px max(16px,env(safe-area-inset-left,0px)) calc(14px + env(safe-area-inset-bottom,0px));background:var(--surface);border-top:3px solid var(--sc,var(--good));box-shadow:0 -14px 30px -12px var(--shadow);animation:up .22s ease-out}
.sheet.bad{--sc:var(--bad)}
.sheet-in{max-width:520px;margin:0 auto;display:grid;gap:10px}
.sheet h3{font:700 19px/1.2 var(--f-body);color:var(--sc,var(--good))}
.sheet .ans{font-size:15px}
.sheet .ans.ko{font-family:var(--f-ko)}

function enVoiceNote(){
  if(!enUK()||!tts.ok||!tts.voices.length)return '';

  return has?'':'この端末にはイギリス英語の音声が入っていないので、ほかの英語の音声で読み上げます。';
}

/* ================= MORE PROFESSION UNITS (1): 留学生 + aviation ================= */
/* adds units to a profession for every language that has them (scene ids are kept as they are) */
function profMore(pid,byLang){
  var p=profById(pid);if(!p)return;
  ORDER.forEach(function(l){
    (Array.isArray(byLang)?byLang:(byLang[l]||[])).forEach(function(uid){
      if(p.units[l].indexOf(uid)<0)p.units[l].push(uid);
      var u=PU[l][uid];if(u&&!UNITS[l][uid])UNITS[l][uid]={id:uid,items:u.items,track:p.id};
    });
    ALL_IDS[l]=Object.keys(UNITS[l]);
  });
}

function hash(s){var h=2166136261;for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
function seeded(seed){var a=seed>>>0;return function(){a=(a+0x6D2B79F5)|0;var t=Math.imul(a^a>>>15,1|a);t=(t+Math.imul(t^t>>>7,61|t))^t;return((t^t>>>14)>>>0)/4294967296;};}

var KEY='babelflight.save.v1';
var OLD_ORDER=['checkin','inflight','immigration','hotel','restaurant','city','atc1','atc2'];
function blankProg(){var p={};ORDER.forEach(function(k){p[k]={items:{},units:{}};});return p;}
function defaults(){return {v:2,t:0,name:'PASSENGER',icon:'',rz:0,lang:'ko',prof:'',level:'mid',goal:2,onboarded:false,theme:'auto',sound:true,mode:'daily',amb:false,tap:true,pos:{},
  miles:0,flights:0,streak:0,lastDay:'',bestStreak:0,daily:{d:'',n:0},mh:null,st:null,cap:0,tq:0,enVar:'us',acc:{},rem:{},stMax:0,accent:'',prog:blankProg()};}
function mergeSave(raw){
  var d=defaults();
  if(!raw||typeof raw!=='object')return d;
  Object.keys(d).forEach(function(k){if(raw[k]!==undefined&&k!=='prog'&&k!=='daily')d[k]=raw[k];});
  if(raw.daily&&typeof raw.daily==='object'){
    if(raw.daily.d!==undefined)d.daily={d:raw.daily.d,n:raw.daily.n||0};
    else{var ks=Object.keys(raw.daily);if(ks.length)d.daily={d:ks[0],n:raw.daily[ks[0]]||0};}
  }
  ORDER.forEach(function(k){
    var p=raw.prog&&raw.prog[k];if(!p)return;
    var items={};
    Object.keys(p.items||{}).forEach(function(key){
      var m=/^(\d+)\.(\d+)$/.exec(key);
      if(m&&OLD_ORDER[+m[1]])items[OLD_ORDER[+m[1]]+'.'+m[2]]=p.items[key];
      else items[key]=p.items[key];
    });
    d.prog[k].items=items;d.prog[k].units=p.units||{};
  });
  if(ORDER.indexOf(d.lang)<0)d.lang='ko';
  if(d.prof==='study'){d.prof='';if(d.mode==='job'){d.mode='study';ORDER.forEach(function(l){if(typeof d.pos[l+'-job']==='number')d.pos[l+'-study']=d.pos[l+'-job'];});}}
  if(d.prof&&!profById(d.prof))d.prof='';
  if(['beg','mid','adv'].indexOf(d.level)<0)d.level='mid';
  d.goal=clamp(parseInt(d.goal,10)||2,1,5);
  if(d.mode!=='job'&&d.mode!=='study'&&d.mode!=='exam')d.mode='daily';
  if(typeof d.icon!=='string'||!ICON_MAP[d.icon])d.icon='';
  d.rz=+d.rz||0;
  /* miles per day (for the 6-month status); older saves start with their total as of today */
  var mh={};
  if(raw.mh&&typeof raw.mh==='object'){Object.keys(raw.mh).forEach(function(k){var v=+raw.mh[k];if(/^\d{4}-\d\d-\d\d$/.test(k)&&v>0)mh[k]=Math.round(v);});}
  else if(d.miles>0)mh[dayStr()]=Math.round(+d.miles||0);
  d.mh=mh;
  var st=raw.st;d.st=(st&&typeof st==='object'&&st.lv>=0&&st.lv<RANKS.length&&+st.until>0)?{lv:Math.floor(st.lv),until:+st.until}:null;
  if(d.enVar!=='uk')d.enVar='us';
  var acc={},rem={};
  ORDER.forEach(function(l){
    var a=raw.acc&&raw.acc[l];if(a&&+a.n>0&&+a.a>=0&&+a.a<=1)acc[l]={a:+a.a,n:Math.floor(+a.n)};
    var r=raw.rem&&raw.rem[l];
    if(Array.isArray(r))rem[l]=r.filter(function(x){return x&&typeof x.u==='string'&&UNITS[l][x.u]&&Array.isArray(x.k)&&x.k.length;}).slice(0,6).map(function(x){
      return {u:x.u,k:x.k.filter(function(k){return typeof k==='string'&&/^.+\.\d+$/.test(k);}).slice(0,8),t:+x.t||0};}).filter(function(x){return x.k.length;});
  });
  d.acc=acc;d.rem=rem;
  d.stMax=Math.max(0,Math.min(RANKS.length-1,Math.floor(+d.stMax||0)));
  if(typeof d.accent!=='string'||!/^[a-z]{0,10}$/.test(d.accent))d.accent='';
  d.cap=+d.cap>0?+d.cap:0;d.tq=+d.tq>0?Math.floor(+d.tq):0;
  return d;
}
function loadLocal(){try{return mergeSave(JSON.parse(localStorage.getItem(KEY)||'null'));}catch(e){return defaults();}}
var save=loadLocal();
function persistLocal(){try{localStorage.setItem(KEY,JSON.stringify(save));}catch(e){}}
var cloud={doc:null,ready:false,timer:0,busy:false,again:false};
function store(){save.t=Date.now();persistLocal();pushCloud();}
function pushCloud(){
  if(!cloud.doc)return;
  clearTimeout(cloud.timer);
  cloud.timer=setTimeout(function(){
    if(cloud.busy){cloud.again=true;return;}
    cloud.busy=true;
    cloud.doc.set({v:2,t:save.t,s:JSON.stringify(save)}).catch(function(){}).then(function(){
      cloud.busy=false;if(cloud.again){cloud.again=false;pushCloud();}
    });
  },1500);
}
function initCloud(){
  if(!window.claude||typeof claude.use!=='function')return;
  Promise.all([claude.use('db'),claude.use('user')]).then(function(r){
    var db=r[0],user=r[1];
    if(!db||!user)return null;
    return user.id().then(function(id){
      if(!id)return null;
      cloud.doc=db.doc('data/users/'+id+'/app');
      return cloud.doc.get();
    });
  }).then(function(snap){
    if(!cloud.doc)return;
    cloud.ready=true;
    var d=snap&&snap.exists?snap.data():null;
    if(d&&d.s){
      var remote=null;try{remote=mergeSave(JSON.parse(d.s));remote.t=d.t||0;}catch(e){}
      if(remote&&remote.t>(save.t||0)&&view!=='flight'&&view!=='atc'){save=remote;persistLocal();applyTheme();if(save.onboarded&&view==='onboard')view='home';render();return;}
    }
    if(save.flights>0||save.t>0)pushCloud();
  }).catch(function(){});
}

function ik(uid,i){return uid+'.'+i;}
function unitOf(lang,uid){return UNITS[lang][uid];}
function itemRec(lang,uid,i){return save.prog[lang].items[ik(uid,i)]||{b:0,d:0};}
function unitRec(lang,uid){return save.prog[lang].units[uid]||{n:0,stars:0,last:''};}
function unitMastery(lang,uid){
  var u=unitOf(lang,uid),s=0;
  if(u.kind==='scene')return (unitRec(lang,uid).stars||0)/3;
  for(var i=0;i<u.items.length;i++)s+=Math.min(itemRec(lang,uid,i).b,4)/4;
  return s/u.items.length;
}
function unitDue(lang,uid){

}

/* miles earned in the last 6 months (never more than the lifetime total) */
function milesWindow(now){var from=dayStr(new Date((now||Date.now())-STATUS_DAYS*DAY)),n=0,mh=save.mh||{};Object.keys(mh).forEach(function(k){if(k>from)n+=mh[k]||0;});return Math.min(n,save.miles||0);}
/* the status shown now: the one kept from the last 6 months, or what the recent miles reach */
function statusIdx(now){now=now||Date.now();var w=rankIdx(milesWindow(now)),st=save.st;return st&&st.until>now?Math.max(st.lv,w):w;}
/* after a lesson: record the miles; reaching (or holding) a status keeps it for 6 more months */
function statusEarn(add){
  var now=Date.now(),today=dayStr(),from=dayStr(new Date(now-(STATUS_DAYS+14)*DAY));
  if(!save.mh)save.mh={};
  save.mh[today]=(save.mh[today]||0)+add;
  Object.keys(save.mh).forEach(function(k){if(k<from)delete save.mh[k];});
  var R=rankIdx(milesWindow(now)),cur=save.st&&save.st.until>now?save.st.lv:-1,firstCap=false;
  if(R>=cur)save.st={lv:R,until:now+STATUS_DAYS*DAY};
  save.stMax=Math.max(save.stMax||0,statusIdx(now));
  if(R===RANKS.length-1&&!save.cap){save.cap=now;firstCap=true;}
  return firstCap;
}

var ac=null;
function audio(){
  if(!ac){try{ac=new (window.AudioContext||window.webkitAudioContext)();}catch(e){ac=null;}}
  if(ac&&ac.state==='suspended'){try{ac.resume();}catch(e){}}
  return ac;
}
function tone(f,d,type,vol,delay,slide){
  if(!save.sound)return;var a=audio();if(!a)return;
  try{
    var t=a.currentTime+(delay||0),o=a.createOscillator(),g=a.createGain();
    o.type=type||'sine';o.frequency.setValueAtTime(f,t);
    if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(40,f+slide),t+d);
    g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol||0.08,t+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
    o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+0.05);
  }catch(e){}
}
function clack(){
  if(!save.sound)return;var a=audio();if(!a)return;
  try{
    var n=Math.floor(a.sampleRate*0.018),b=a.createBuffer(1,n,a.sampleRate),c=b.getChannelData(0);
    for(var i=0;i<n;i++)c[i]=(Math.random()*2-1)*Math.pow(1-i/n,2);
    var s=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain();
    s.buffer=b;f.type='bandpass';f.frequency.value=1800+Math.random()*1200;g.gain.value=0.18;
    s.connect(f);f.connect(g);g.connect(a.destination);s.start();
  }catch(e){}
}
function chimeOK(){tone(988,0.5,'sine',0.07,0);tone(1319,0.7,'sine',0.06,0.12);}
function chimeBad(){tone(180,0.35,'triangle',0.1,0,-70);tone(140,0.4,'triangle',0.08,0.12,-50);}
function chimeLand(){tone(784,0.6,'sine',0.08,0);tone(988,0.9,'sine',0.07,0.35);tone(784,0.9,'sine',0.05,0.75);}
function buzz(ms){try{if(navigator.vibrate)navigator.vibrate(ms);}catch(e){}}
var tts={ok:('speechSynthesis' in window)&&('SpeechSynthesisUtterance' in window),voices:[]};
function loadVoices(){try{tts.voices=speechSynthesis.getVoices()||[];}catch(e){}}
if(tts.ok){loadVoices();try{speechSynthesis.onvoiceschanged=loadVoices;}catch(e){}}
function voiceFor(code){
  var c=code.toLowerCase(),p=c.slice(0,2),best=null;
  tts.voices.forEach(function(v){if(!best&&v.lang&&v.lang.replace('_','-').toLowerCase()===c)best=v;});
  if(!best)tts.voices.forEach(function(v){if(!best&&v.lang&&v.lang.slice(0,2).toLowerCase()===p)best=v;});
  return best;
}
function ttsAvail(code){if(!tts.ok)return false;if(!tts.voices.length)return true;return !!voiceFor(code);}
function speak(text,code,slow,force){
  if(!tts.ok)return;if(!force&&!save.sound)return;
  try{
    speechSynthesis.cancel();
    var u=new SpeechSynthesisUtterance(text);u.lang=code;
    var v=voiceFor(code);if(v)u.voice=v;
    u.rate=slow?0.6:0.9;speechSynthesis.speak(u);
  }catch(e){}
}

/* ================= SPLIT-FLAP BOARD ================= */
var CH_LAT='ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
var CH_KO='가나다라마바사아자차카타파하한국어서울공항비행기';
var HANGUL=/[가-힣]/;
function randCh(target){
  var pool=HANGUL.test(target)?CH_KO:CH_LAT;
  return pool.charAt(Math.floor(Math.random()*pool.length));
}
function Board(host){this.host=host;this.cols=0;this.rows=0;this.cells=[];this.text=null;}
Board.prototype.layout=function(text,minCols){
  var up=text.toUpperCase(),words=up.split(/\s+/).filter(Boolean),longest=0;
  words.forEach(function(w){if(w.length>longest)longest=w.length;});
  var cols=Math.max(minCols,longest),lines=[],cur='';
  words.forEach(function(w){
    if(!cur)cur=w;else if((cur+' '+w).length<=cols)cur+=' '+w;else{lines.push(cur);cur=w;}
  });
  if(cur)lines.push(cur);
  var rows=Math.max(3,lines.length),off=Math.floor((rows-lines.length)/2),grid=[];
  for(var r=0;r<rows;r++){
    var line=lines[r-off]||'',pad=Math.floor((cols-line.length)/2),arr=[];
    for(var c=0;c<cols;c++){var ch=line.charAt(c-pad);arr.push(c>=pad&&ch?ch:' ');}
    grid.push(arr);
  }
  return {cols:cols,rows:rows,grid:grid};
};
Board.prototype.build=function(cols,rows){
  var h='<div class="bgrid" style="--cols:'+cols+'">',r,c;
  for(r=0;r<rows;r++){h+='<div class="brow">';for(c=0;c<cols;c++)h+='<div class="cell"><div class="h t"><span></span></div><div class="h b"><span></span></div><div class="f ft"><span></span></div><div class="f fb"><span></span></div></div>';h+='</div>';}
  h+='</div>';
  this.host.innerHTML=h;
  var els=this.host.querySelectorAll('.cell');
  this.cells=[];
  for(var i=0;i<els.length;i++){
    var e=els[i];
    this.cells.push({el:e,top:e.querySelector('.t span'),bot:e.querySelector('.b span'),ft:e.querySelector('.ft'),fb:e.querySelector('.fb'),
      ftS:e.querySelector('.ft span'),fbS:e.querySelector('.fb span'),cur:' ',target:' ',steps:0,busy:false});
  }
  this.cols=cols;this.rows=rows;
};
function setTxt(s,ch){s.textContent=ch===' '?'':ch;}
function flipStep(cell,from,to,done){
  var T=48;
  if(reduceMotion||!cell.ft.animate){setTxt(cell.top,to);setTxt(cell.bot,to);done();return;}
  setTxt(cell.top,to);setTxt(cell.bot,from);setTxt(cell.ftS,from);setTxt(cell.fbS,to);
  cell.ft.style.visibility='visible';cell.fb.style.visibility='visible';
  var a=cell.ft.animate([{transform:'rotateX(0deg)'},{transform:'rotateX(-90deg)'}],{duration:T,easing:'ease-in',fill:'forwards'});
  var b=cell.fb.animate([{transform:'rotateX(90deg)'},{transform:'rotateX(0deg)'}],{duration:T,delay:T,easing:'ease-out',fill:'both'});
  b.onfinish=function(){
    setTxt(cell.bot,to);cell.ft.style.visibility='hidden';cell.fb.style.visibility='hidden';
    try{a.cancel();b.cancel();}catch(e){}
    done();
  };
}
function runCell(cell){
  (function loop(){
    if(cell.cur===cell.target&&cell.steps<=0){cell.busy=false;return;}
    var nxt;
    if(cell.steps>0){cell.steps--;nxt=randCh(cell.target===' '?cell.cur:cell.target);}
    else nxt=cell.target;
    flipStep(cell,cell.cur,nxt,function(){cell.cur=nxt;loop();});
  })();
}
Board.prototype.set=function(text){
  var minCols=this.minCols||13;
  var L=this.layout(text||'',minCols);
  if(L.cols!==this.cols||L.rows!==this.rows||!this.cells.length)this.build(L.cols,L.rows);
  this.host.setAttribute('role','img');
  this.host.setAttribute('aria-label',text?text:'表示ボード(空白)');
  var n=0,idx=0;
  for(var r=0;r<L.rows;r++)for(var c=0;c<L.cols;c++){
    var cell=this.cells[idx],ch=L.grid[r][c];idx++;
    if(cell.target===ch&&!(cell.cur!==ch&&!cell.busy))continue;
    cell.target=ch;n++;
    if(reduceMotion){cell.cur=ch;cell.steps=0;setTxt(cell.top,ch);setTxt(cell.bot,ch);continue;}
    cell.steps=ch===' '?1+Math.floor(Math.random()*2):2+Math.floor(Math.random()*5);
    if(!cell.busy){cell.busy=true;(function(cl,d){setTimeout(function(){runCell(cl);},d);})(cell,idx*9+Math.random()*140);}
  }
  var clicks=Math.min(9,Math.ceil(n/3));
  for(var k=0;k<clicks;k++)setTimeout(clack,k*75+Math.random()*40);
  this.text=text;
};

function nextPathUnit(L,cur){
  if(typeof examNext==='function'){var xn=examNext(L,cur);if(xn!==undefined)return xn;}
  var ids=pathIds(L),i,best=null,bd=0;
  if(!ids.length)return null;
  /* stay in the same group: the next unit not flown yet (入国審査 → カフェ), then the next group */
  var secs=pathSections(L);
  for(var s=0;cur&&s<secs.length;s++){
    var g=secs[s].ids,k=g.indexOf(cur),j;
    if(k<0)continue;
    for(j=1;j<g.length;j++){var u=g[(k+j)%g.length];if(unitRec(L,u).n===0)return u;}
    if(k+1<g.length)return g[k+1];
    for(j=1;j<secs.length;j++){var g2=secs[(s+j)%secs.length].ids;for(i=0;i<g2.length;i++)if(unitRec(L,g2[i]).n===0)return g2[i];}
    break;
  }
  for(i=0;i<ids.length;i++)if(unitRec(L,ids[i]).n===0)return ids[i];
  for(i=0;i<ids.length;i++){var d=unitDue(L,ids[i]);if(d>bd){bd=d;best=ids[i];}}
  return best||ids[0];
}
function land(){
  var L=F.lang,now=Date.now(),P=save.prog[L];

  if(F.mode==='ai'){landAi();return;}
  if(F.mode==='mock'&&typeof landMock==='function'){landMock();return;}
  keys.forEach(function(k){
    var rec=P.items[k]||{b:0,d:0},w=F.wrong[k]||0,wasDue=rec.b===0||rec.d<=now;
    if(w===0){
      if(rec.b===0){rec.b=1;rec.d=now+INTERVALS[1]*DAY;}
      else if(wasDue){rec.b=Math.min(6,rec.b+1);rec.d=now+INTERVALS[rec.b]*DAY;}
      if(rec.m)rec.k=(rec.k||0)+1;
    }else{rec.b=Math.max(1,rec.b-1);rec.d=now+0.5*DAY;rec.m=(rec.m||0)+w;rec.k=0;}
    P.items[k]=rec;
  });

  var grade=mist===0?['完璧な着陸','PERFECT LANDING','ミスなし！バターのようになめらか']:mist<=2?['なめらかな着陸','SMOOTH LANDING','いい調子。この感覚で続けよう']:mist<=5?['しっかり着陸','FIRM LANDING','間違えたフレーズは復習に回るよ']:['ちょっと揺れた着陸','HARD LANDING','大丈夫。間違えた分だけ記憶に残りやすいよ'];
  var wrongKeys=keys.filter(function(k){return F.wrong[k];});
  var wrong=wrongKeys.slice(0,5).map(function(k){var it=uniq[k];return UNITS[L][it.uid].items[it.i];});

var PREVVIEW=null,RVO=null;
function countUp(el){
  var walker=document.createTreeWalker(el,NodeFilter.SHOW_TEXT,null),node=null,m=null;
  while(walker.nextNode()){m=/(\d[\d,]*)/.exec(walker.currentNode.nodeValue);if(m){node=walker.currentNode;break;}}
  if(!node)return;
  var raw=m[1],target=parseInt(raw.replace(/,/g,''),10);if(!target)return;
  var comma=raw.indexOf(',')>=0||target>=1000,padTo=raw.charAt(0)==='0'?raw.length:0,pre=node.nodeValue.slice(0,m.index),post=node.nodeValue.slice(m.index+raw.length),t0=performance.now(),dur=Math.min(1100,450+target*6);
  function f(v){var s=comma?v.toLocaleString('en-US'):String(v);while(s.length<padTo)s='0'+s;return s;}
  (function step(now){
    var t=clamp((now-t0)/dur,0,1),e=1-Math.pow(1-t,3);
    node.nodeValue=pre+f(Math.round(target*e))+post;
    if(t<1)requestAnimationFrame(step);
  })(t0);
}

/* ================= LEVEL ADJUSTMENT =================
   Follows each learner's accuracy per language:
   - 飛び級テスト: learners who keep getting things right can skip a unit with a short, harder test.
   - 補習フライト: a lesson with many mistakes adds an extra flight built from those phrases,
     asked in different forms (穴埋め・並べ替え・聞き取り・入力).
   - Answer choices get closer to the right answer for strong learners, and further for those who struggle.
   - AIの例文練習: AI writes new example sentences around the phrases that were missed (when AI is available). */
var SKIP_N=6,SKIP_MAX_MISS=1,REM_MAX=6;
function accOf(L){var a=save.acc&&save.acc[L];return a&&a.n>0?a:{a:0.75,n:0};}
function accNote(L,corr,answered){
  if(!(answered>0))return;
  if(!save.acc)save.acc={};
  var r=clamp(corr/answered,0,1),a=save.acc[L];
  save.acc[L]=a&&a.n>0?{a:Math.round((a.a*0.7+r*0.3)*1000)/1000,n:Math.min(a.n+1,999)}:{a:Math.round(r*1000)/1000,n:1};
}
/* how many look-alike choices to mix in: more for strong learners, none for those who struggle */
function lookAlikes(L){var a=accOf(L);if(a.n<2)return Math.random()<0.5?1:2;return a.a>=0.88?3:a.a>=0.7?(Math.random()<0.5?1:2):0;}
function skipEligible(L,uid){
  var u=UNITS[L][uid],a=accOf(L);
  if(!(u&&u.kind!=='scene'&&u.items.length>=SKIP_N))return false;
  if(typeof entitled==='function'&&entitled())return true; /* test account: always offered */
  return unitRec(L,uid).n===0&&a.n>=3&&a.a>=0.85;
}

  out.flights=Math.max(a.flights||0,b.flights||0);
  out.bestStreak=Math.max(a.bestStreak||0,b.bestStreak||0);
  if((older.lastDay||'')>(out.lastDay||'')){out.lastDay=older.lastDay;out.streak=older.streak;}
  else if(older.lastDay===out.lastDay)out.streak=Math.max(a.streak||0,b.streak||0);

  if((od.d||'')>(out.daily.d||''))out.daily={d:od.d,n:od.n||0};
  else if(od.d===out.daily.d)out.daily.n=Math.max(out.daily.n||0,od.n||0);

  ORDER.forEach(function(l){var m={};[older.rem&&older.rem[l]||[],out.rem&&out.rem[l]||[]].forEach(function(list){list.forEach(function(r){if(!m[r.u]||r.t>=m[r.u].t)m[r.u]=r;});});
    if(!out.rem)out.rem={};out.rem[l]=Object.keys(m).map(function(k){return m[k];}).sort(function(x,y){return y.t-x.t;}).slice(0,6);});

    if(xv&&yv)return x.lv!==y.lv?(x.lv>y.lv?x:y):(x.until>=y.until?x:y);if(xv!==yv)return xv?x:y;return x.until>=y.until?x:y;})(a.st,b.st);
  var op=older.pos||{};if(!out.pos)out.pos={};
  Object.keys(op).forEach(function(k){if(typeof op[k]==='number'&&!(out.pos[k]>=op[k]))out.pos[k]=op[k];});

    var src=older.prog[L],dst=out.prog[L];
    Object.keys(src.items).forEach(function(k){

      if(!y||(x.b||0)>(y.b||0)||((x.b||0)===(y.b||0)&&(x.d||0)>(y.d||0)))dst.items[k]=x;
    });

function acctParse(data,t){

function acctUnsafe(){return view==='flight'||view==='atc'||view==='scene';}
/* adopt a remote copy now, or after the current lesson/call ends */
function acctMerge(remote,replace){
  if(acctUnsafe()){ACCT.pend={r:remote,replace:!!replace};return false;}
  var theme=save.theme;
  save=replace?remote:unionSave(save,remote);
  persistLocal();
  applyTheme();

}
/* after adopting another copy, make sure the screen matches it (e.g. a reset on another device) */

/* ---- sync ---- */
var ACCT_DOC={set:function(doc){return acctPush(doc.s,doc.t);}};
function acctOk(){ACCT.state='ok';ACCT.last=Date.now();acctRefresh();}
function acctPushNow(){if(cloud.doc!==ACCT_DOC||ACCT.pend)return;acctPush(JSON.stringify(save),save.t);}
function acctPush(data,t){
  if(!ACCT.me||ACCT.pend)return Promise.resolve();
  ACCT.dirty=true;ACCT.state='sync';acctRefresh();
  var force=ACCT.force;ACCT.force=false;
  return acctApi('PUT','/api/account/save',{data:data,t:t||0,baseRev:ACCT.rev,force:force}).then(function(j){
    if(j.ok){ACCT.rev=j.rev;ACCT.dirty=false;ACCT.tries=0;acctOk();return;}
    if(j._s===401){acctSignedOut();return;}
    if(j._s===409&&ACCT.tries<3){
      ACCT.tries++;
      ACCT.rev=j.rev||ACCT.rev;
      var remote=acctParse(j.data,j.t);
      if(remote&&acctMerge(remote,false))return acctPush(JSON.stringify(save),save.t);
      return;
    }
    ACCT.tries=0;ACCT.state='err';acctRefresh();
  },function(){ACCT.state='off';acctRefresh();});
}
function acctStartSync(otherAccount){
  ACCT.state='sync';acctRefresh();
  return acctApi('GET','/api/account/save').then(function(j){
    if(j._s===401){acctSignedOut();return;}
    if(!j.ok)throw {code:'server',s:j._s,e:j.error};
    ACCT.rev=j.rev||0;
    cloud.doc=ACCT_DOC;
    var remote=acctParse(j.data,j.t);
    if(remote){
      var fresh=!save.onboarded&&!save.t;
      acctMerge(remote,fresh||otherAccount);
      if(sameSave(save,remote))acctOk();else acctPushNow();
    }else if(save.onboarded||save.t>0)acctPushNow();
    else acctOk();
  },function(){ACCT.state='off';acctRefresh();});
}
function acctPull(){
  if(!ACCT.me||ACCT.pulling)return;
  ACCT.pulling=true;ACCT.state='sync';acctRefresh();
  acctApi('GET','/api/account/save').then(function(j){
    if(j._s===401){acctSignedOut();return;}
    if(!j.ok)throw 0;
    if((j.rev||0)>ACCT.rev){
      ACCT.rev=j.rev;
      var remote=acctParse(j.data,j.t);
      if(remote)acctMerge(remote,false);
      if(remote&&sameSave(save,remote)&&!ACCT.dirty)acctOk();else acctPushNow();
    }else if(ACCT.dirty)acctPushNow();
    else acctOk();
  }).catch(function(){ACCT.state='off';acctRefresh();}).then(function(){ACCT.pulling=false;});
}
document.addEventListener('visibilitychange',function(){if(!document.hidden)acctPull();});

window.addEventListener('online',function(){if(!ACCT.cfg)acctBoot();});
/* a progress reset while signed in replaces the account copy too */
document.addEventListener('click',function(e){

/* ---- sign in / out ---- */
function acctAfterFirebase(user){
  return user.getIdToken().then(function(tok){return acctApi('POST','/api/account/session',{idToken:tok});}).then(function(j){
    if(!j.ok)throw {code:'server',s:j._s,e:j.error};
    if(j.token)bfSetToken(j.token);
    var prevUid=acctHint().uid||'';
    ACCT.me={uid:j.uid,provider:j.provider};ACCT.msg='';entSet(j.ent);
    acctSetHint({uid:j.uid,email:user.email||'',provider:j.provider});
    return acctStartSync(!!prevUid&&prevUid!==j.uid);
  });
}
function acctDone(){closeSheet();if(view==='record'||view==='onboard')render();}
function acctSignedOut(msg){
  ACCT.me=null;ACCT.rev=0;ACCT.state='';ACCT.dirty=false;ACCT.pend=null;entSet(null);bfSetToken('');
  if(cloud.doc===ACCT_DOC)cloud.doc=null;

function acctLogout(){
  if(ACCT.busy)return;
  acctBusy(true);
  (ACCT.dirty?acctPush(JSON.stringify(save),save.t):Promise.resolve()).catch(function(){})
    .then(function(){return acctApi('POST','/api/account/logout',{});}).catch(function(){})
    .then(function(){
      try{if(ACCT.fb)ACCT.fb.F.signOut(ACCT.fb.auth);}catch(e){}
      acctBusy(false);acctSignedOut('ログアウトしました。この端末の記録はそのまま使えます。');
    });
}
function acctDeleteWith(user){
  return user.getIdToken(true).then(function(tok){return acctApi('POST','/api/account/delete',{idToken:tok});}).then(function(j){
    if(!j.ok)throw {code:'server',s:j._s,e:j.error};
    var F=ACCT.fb.F,code=ACCT.appleCode;ACCT.appleCode='';
    return (code&&F.revokeAccessToken?F.revokeAccessToken(ACCT.fb.auth,code).catch(function(){}):Promise.resolve())
      .then(function(){return F.deleteUser(user).catch(function(){});});
  }).then(function(){
    acctSetHint({});closeSheet();
    acctSignedOut('アカウントを削除しました。この端末の記録はそのまま残っています。');
  });

function acctErr(msg){var e=$('acErr')||$('acNote');if(e)e.textContent=msg||'';}
function acctBusy(on){
  ACCT.busy=on;
  var s=document.querySelector('.acct-sheet');if(!s)return;
  s.classList.toggle('busy',on);
  Array.prototype.forEach.call(s.querySelectorAll('button,input'),function(b){if(!b.hasAttribute('data-close-sheet'))b.disabled=on||(!ACCT.fb&&b.hasAttribute('data-needs-fb'));});

function acctGoogle(del){
  var fb=ACCT.fb;if(!fb||ACCT.busy)return;
  var prov=new fb.F.GoogleAuthProvider();prov.setCustomParameters({prompt:'select_account'});
  acctErr('');
  var p=fb.F.signInWithPopup(fb.auth,prov);   /* must start inside the tap, before any await */
  acctBusy(true);
  p.then(function(c){return del?acctDeleteWith(c.user):acctAfterFirebase(c.user).then(acctDone);})
    .catch(function(err){acctErr(err&&err.code==='server'?acctServerMsg(err):fbMsg(err));})

/* In the iPhone app, Google and Apple sign in through the system's own sheets (Firebase
   Authentication plugin); the result is handed to the Firebase web SDK, so the rest of the flow
   (server session, sync, deletion) is the same as on the website. */
function acctNativeMsg(err){
  var m=String((err&&(err.message||err.code))||'');
  if(/cancel|1001|12501|popup-closed/i.test(m))return '';
  if(err&&err.code&&String(err.code).indexOf('auth/')===0)return fbMsg(err);
  return 'ログインできませんでした。もう一度試してね。';
}
function acctNative(provider,del){
  var fb=ACCT.fb;if(!fb||ACCT.busy)return;
  var P=null;try{P=window.Capacitor.Plugins.FirebaseAuthentication;}catch(e){}
  if(!P){acctErr('このログイン方法は今は使えません。');return;}
  var F=fb.F,apple=provider==='apple.com';
  acctErr('');acctBusy(true);
  (apple?P.signInWithApple({skipNativeAuth:true}):P.signInWithGoogle({skipNativeAuth:true})).then(function(r){
    var c=(r&&r.credential)||{};
    if(!c.idToken)throw {message:'no token'};
    ACCT.appleCode=apple?(c.authorizationCode||''):'';
    var cred=apple?new F.OAuthProvider('apple.com').credential({idToken:c.idToken,rawNonce:c.nonce}):F.GoogleAuthProvider.credential(c.idToken,c.accessToken||null);
    return F.signInWithCredential(fb.auth,cred);
  }).then(function(uc){return del?acctDeleteWith(uc.user):acctAfterFirebase(uc.user).then(acctDone);})
    .catch(function(err){acctErr(err&&err.code==='server'?acctServerMsg(err):acctNativeMsg(err));})
    .then(function(){acctBusy(false);});
}
document.addEventListener('submit',function(e){
  var f=e.target;if(!f||f.id!=='acctForm')return;
  e.preventDefault();
  if(f.getAttribute('data-mode')==='name'){
    var nm=(($('acName')||{}).value||'').replace(/[\u0000-\u001f\u007f]/g,'').trim();
    if(Array.from(nm).length>14){acctErr('14文字までにしてね。');return;}
    save.name=nm||'PASSENGER';store();closeSheet();render();return;
  }
  var fb=ACCT.fb;if(!fb||ACCT.busy)return;
  var mode=f.getAttribute('data-mode'),F=fb.F;
  var em=(($('acEmail')||{}).value||'').trim(),pw=($('acPass')||{}).value||'',pw2=($('acPass2')||{}).value||'';
  if(!em){acctErr('メールアドレスを入れてね。');return;}
  if(mode==='signup'){
    if(pw.length<8){acctErr('パスワードは8文字以上にしてね。');return;}
    if(pw!==pw2){acctErr('確認用のパスワードが1回目と違います。');return;}
  }
  if((mode==='login'||mode==='delete')&&!pw){acctErr('パスワードを入れてね。');return;}
  acctErr('');acctBusy(true);
  var p;
  if(mode==='reset')p=F.sendPasswordResetEmail(fb.auth,em).then(function(){acctBusy(false);acctSheet('login','再設定のメールを送ったよ。届かないときは迷惑メールフォルダも見てね。');});
  else if(mode==='signup')p=F.createUserWithEmailAndPassword(fb.auth,em,pw).then(function(c){F.sendEmailVerification(c.user).catch(function(){});return acctAfterFirebase(c.user);}).then(acctDone);
  else if(mode==='login')p=F.signInWithEmailAndPassword(fb.auth,em,pw).then(function(c){return acctAfterFirebase(c.user);}).then(acctDone);
  else p=F.signInWithEmailAndPassword(fb.auth,em,pw).then(function(c){return acctDeleteWith(c.user);});
  p.catch(function(err){acctErr(err&&err.code==='server'?acctServerMsg(err):fbMsg(err));}).then(function(){acctBusy(false);});

function xtrainPick(b,n){
  var now=Date.now(),due=[],weak=[],rest=[];
  bankItems(b).forEach(function(o){
    var r=itemRec(b.L,o.uid,o.i);
    if(!r.b)return;
    if(r.d<=now)due.push(o);else if((r.m||0)>0&&(r.k||0)<2)weak.push(o);else rest.push(o);
  });
  due.sort(function(a,c){return itemRec(b.L,a.uid,a.i).d-itemRec(b.L,c.uid,c.i).d;});
  rest=shuffle(rest).sort(function(a,c){return itemRec(b.L,a.uid,a.i).b-itemRec(b.L,c.uid,c.i).b;});
  return due.concat(shuffle(weak),rest).slice(0,n);
}

/* ---- 発音チェック (speech recognition built into the browser; nothing is sent to this site) ---- */
var SRX={rec:null};
function srCtor(){return window.SpeechRecognition||window.webkitSpeechRecognition||null;}
function srStop(){if(SRX.rec){try{SRX.rec.abort();}catch(e){}SRX.rec=null;}}
function srListen(lang,done,state){
  var C=srCtor();if(!C){done(null,'unsupported');return;}
  srStop();
  var r=new C(),fin=false;SRX.rec=r;
  r.lang=lang;r.interimResults=false;r.maxAlternatives=3;r.continuous=false;
  function end(alts,err){if(fin)return;fin=true;if(SRX.rec===r)SRX.rec=null;if(state)state(false);done(alts,err);}
  r.onresult=function(ev){var res=ev.results&&ev.results[0],alts=[];if(res)for(var i=0;i<res.length;i++)alts.push(res[i].transcript);end(alts.length?alts:null,alts.length?null:'no-speech');};
  r.onerror=function(ev){end(null,(ev&&ev.error)||'error');};
  r.onend=function(){end(null,'no-speech');};
  try{r.start();if(state)state(true);}catch(e){end(null,'error');}
}
function srErrText(c){
  if(c==='not-allowed'||c==='service-not-allowed')return 'マイクが許可されていません。ブラウザの設定でマイクを許可してね。';
  if(c==='no-speech'||c==='aborted')return '声が聞き取れませんでした。もう一度、はっきり言ってみてね。';
  if(c==='unsupported')return 'このブラウザは音声認識に対応していません(ChromeやSafariで使えます)。';
  if(c==='network')return '音声認識には通信が必要です。電波を確認してね。';
  if(c==='language-not-supported')return 'この端末では、この言語の音声認識が使えません。';
  return 'うまく聞き取れませんでした。もう一度試してね。';
}
var NUMW=['zero','one','two','three','four','five','six','seven','eight','nine','ten','eleven','twelve','thirteen','fourteen','fifteen','sixteen','seventeen','eighteen','nineteen','twenty'];
function normSay(s,L){
  s=String(s||'').toLowerCase();
  if(L!=='ko')s=s.normalize('NFD').replace(/[̀-ͯ]/g,'');
  s=s.replace(/[’‘`]/g,"'").replace(/[^\p{L}\p{N}' ]+/gu,' ').replace(/\s+/g,' ').trim();
  if(L==='en')s=s.split(' ').map(function(w){return /^\d+$/.test(w)&&+w<=20?NUMW[+w]:w;}).join(' ');
  return s;
}
function lcsLen(a,b){
  var prev=new Array(b.length+1).fill(0);
  for(var i=1;i<=a.length;i++){var cur=new Array(b.length+1).fill(0);for(var j=1;j<=b.length;j++)cur[j]=a[i-1]===b[j-1]?prev[j-1]+1:Math.max(prev[j],cur[j-1]);prev=cur;}
  return prev[b.length];
}
function sayScore(target,heard,L){
  var a=normSay(target,L),b=normSay(heard,L);
  if(!a||!b)return 0;
  if(L==='ko'){a=Array.from(a.replace(/ /g,'').normalize('NFD'));b=Array.from(b.replace(/ /g,'').normalize('NFD'));}
  else{a=a.split(' ');b=b.split(' ');}
  return 2*lcsLen(a,b)/(a.length+b.length);
}

function pronRun(btn){

  var r=repLoad()[L]||{d:{},k:{}},weak=weakList(L).slice(0,5).map(function(x){return UNITS[L][x.uid].items[x.i];}).filter(Boolean);

  var tot=[0,0];Object.keys(r.d).forEach(function(k){tot[0]+=r.d[k][0];tot[1]+=r.d[k][1];});
  var body={lang:L,
    phrase:(weak.map(function(d){return d.t;}).join(' / ')||'(苦手なフレーズはまだありません)').slice(0,300),
    jp:(weak.map(function(d){return d.jp;}).join(' / ')||'(なし)').slice(0,300),reading:'',

function roleSend(){
  var inp=$('roleIn');if(!inp||ROLE.busy||ROLE.done||!ROLE.sc)return;
  var text=inp.value.trim().slice(0,300);if(!text)return;
  if(!ROLE.counted){
    if(roleLeft()<=0){ROLE.log.push({who:'me',text:text,err:'今日のロールプレイはここまで。また明日ね！'});roleRefresh();return;}
    lsSet(ROLE_KEY,JSON.stringify({d:dayStr(),n:roleUsed()+1}));ROLE.counted=true;
  }
  inp.value='';ROLE.busy=true;
  var me={who:'me',text:text,wait:true};ROLE.log.push(me);roleRefresh();
  var ctl=typeof AbortController==='function'?new AbortController():null;ROLE.ctl=ctl;
  var at=ROLE,sc=ROLE.sc,L=ROLE.L;
  saiPost('/api/ai/atc',{scenario:'role:'+sc.id+':'+L,history:ROLE.ex.slice(),pilot:text},ctl&&ctl.signal)
  .then(function(r){return r.json().catch(function(){return {};});})
  .then(function(j){
    if(ROLE!==at)return;
    ROLE.busy=false;me.wait=false;
    if(!j||!j.ok){
      me.err=j&&j.error==='plan'?'このアカウントでは使えません。':saiErr(j,'atc');
      if(j&&j.error==='too_long'){ROLE.done=true;render();window.scrollTo(0,document.body.scrollHeight);}else roleRefresh();
      return;
    }
    var s=parseInt(j.score,10);me.score=isNaN(s)?0:clamp(s,0,3);me.fb=String(j.feedback_ja||'');me.better=String(j.better||'');
    var ai=String(j.atc||'').trim();
    ROLE.ex.push({pilot:text,atc:ai,score:me.score,feedback:me.fb,better:me.better});
    if(ai){ROLE.log.push({who:'ai',text:ai});speak(ai,LANGS[L].tts,false,true);}
    if(j.done===true||ROLE.ex.length>=8){ROLE.done=true;render();window.scrollTo(0,document.body.scrollHeight);}
    else roleRefresh();
    if(me.score>=3)chimeOK();
  },function(e){
    if(ROLE!==at)return;
    ROLE.busy=false;me.wait=false;
    if(e&&e.name==='AbortError')return;
    me.err='通信できませんでした。電波を確認して、もう一度送ってね。';roleRefresh();
  });
}

/* ================= THE IPHONE APP (Capacitor) =================
   Everything here only does something inside the app (BF_APP), except vibration, which also works
   in Android browsers. Native features go through Capacitor's plugins (window.Capacitor.Plugins):
   - daily reminder (local notification at a time the user picks; at most 1 a day, none once the
     day's goal is done) - vibration on right / wrong / taps - swipe from the left edge to go back
   - links open in an in-app browser - share images with the system share sheet
   - "airplane mode" note when offline - the save is mirrored to native storage
   - asks before anything is first sent to the AI (App Store rule 5.1.2(i))
   - the class / paid-plan test screens are off (the App Store version is free for now) */
function nat(name){try{var p=window.Capacitor&&window.Capacitor.Plugins;return (p&&p[name])||null;}catch(e){return null;}}
function natCall(name,method,arg){
  var p=nat(name);if(!p||typeof p[method]!=='function')return Promise.reject(new Error('unavailable'));
  try{return Promise.resolve(p[method](arg));}catch(e){return Promise.reject(e);}
}

}

function hapt(kind){
  if(!vibOK()||!devSet().vib)return;
  if(BF_APP){
    var p;
    if(kind==='ok')p=natCall('Haptics','notification',{type:'SUCCESS'});
    else if(kind==='ng')p=natCall('Haptics','notification',{type:'ERROR'});
    else if(kind==='big')p=natCall('Haptics','impact',{style:'HEAVY'});
    else p=natCall('Haptics','impact',{style:'LIGHT'});
    p.catch(function(){});
    return;
  }
  try{navigator.vibrate(kind==='ok'?18:kind==='ng'?[30,40,30]:kind==='big'?[20,40,70]:8);}catch(e){}
}

  if(!BF_APP||!nat('LocalNotifications'))return Promise.resolve();

      if(at.getTime()<=now.getTime()+60000)continue;

      list.push({id:REM_BASE+i,title:'✈️ 搭乗のご案内',body:REM_LINES[(at.getDate()+i)%REM_LINES.length](i),

      '<dt>価格</dt><dd><b>月額 '+billYen(p.amount)+'円(税込)</b></dd>'+
      '<dt>支払い時期</dt><dd>申し込んだときに1か月分。その後は毎月、申し込んだ日と同じ日に自動で支払い</dd>'+
      '<dt>支払い方法</dt><dd>クレジットカード・デビットカード(Stripe)</dd>'+
      '<dt>使える時期</dt><dd>支払いが終わるとすぐ</dd>'+
      '<dt>契約期間</dt><dd>1か月ごとに自動で更新</dd>'+
      '<dt>解約</dt><dd>「記録」→「契約の管理」からいつでもできます。解約しても次の更新日までは使えて、それ以降の請求はありません。月の途中で解約しても、日割りの返金はありません。</dd>'+
    '</dl>'+
    '<label class="bill-ck"><input type="checkbox" id="billAgree"><span>利用規約と、上の内容を確認して同意します</span></label>'+
    '<label class="bill-ck"><input type="checkbox" id="billGuard"><span>18歳以上です。または、保護者の方が内容を確認して申し込みに同意しています</span></label>'+
    '<p class="dim hint">利用規約と特定商取引法に基づく表記は、本番の前にこのサイトに載せます(いまは準備中)。</p>'+
    '<p class="bill-note bad" id="billErr" hidden></p>'+
    '<button class="go" type="button" data-bill-go="'+esc(p.key)+'" disabled>支払い画面へ進む</button>'+
    '<button class="ghost" type="button" data-close-sheet>やめる</button></div></div>';
}
function billCkSync(){
  var a=$('billAgree'),g=$('billGuard'),b=document.querySelector('[data-bill-go]');
  if(b&&!BILL.busy)b.disabled=!(a&&a.checked&&g&&g.checked);
}
function billCheckout(key,btn){
  var a=$('billAgree'),g=$('billGuard'),er=$('billErr');
  if(BILL.busy||!(a&&a.checked&&g&&g.checked))return;
  BILL.busy=true;btn.disabled=true;btn.textContent='Stripeに移動中…';if(er)er.hidden=true;
  billApi('POST','/api/billing/checkout',{plan:key,agree:true,guardian:true}).then(function(j){
    if(j&&j.ok&&typeof j.url==='string'&&/^https:\/\//.test(j.url)){location.assign(j.url);return;}
    BILL.busy=false;btn.textContent='支払い画面へ進む';billCkSync();
    if(er){er.textContent=billErrText(j);er.hidden=false;}
    if(j&&j.error==='active'){BILL.t=0;billFetch();}
  });
}
function billPortal(btn){
  if(BILL.busy)return;
  BILL.busy=true;btn.disabled=true;var t0=btn.innerHTML;btn.textContent='Stripeに移動中…';
  billApi('POST','/api/billing/portal').then(function(j){
    if(j&&j.ok&&typeof j.url==='string'&&/^https:\/\//.test(j.url)){location.assign(j.url);return;}
    BILL.busy=false;btn.disabled=false;btn.innerHTML=t0;
    BILL.msg=billErrText(j);BILL.msgKind='warn';billRefresh();
  });
}
/* back/forward cache: a page restored after going to Stripe must not stay "moving" */
window.addEventListener('pageshow',function(e){if(e.persisted&&BILL.busy){BILL.busy=false;closeSheet();billRefresh();}});
document.addEventListener('change',function(e){var id=e.target&&e.target.id;if(id==='billAgree'||id==='billGuard')billCkSync();});
document.addEventListener('click',function(e){
  var t=e.target&&e.target.closest&&e.target.closest('button');if(!t)return;
  if(t.hasAttribute('data-bill-plan')){if(cabinTester())billConfirmSheet(t.getAttribute('data-bill-plan'));return;}
  if(t.hasAttribute('data-bill-go')){if(cabinTester())billCheckout(t.getAttribute('data-bill-go'),t);return;}
  if(t.hasAttribute('data-bill-portal')){if(cabinTester())billPortal(t);return;}
  if(t.hasAttribute('data-bill-retry')){BILL.err='';billRefresh();BILL.t=0;billFetch();return;}
});
/* ================= EVENTS + BOOT ================= */
function go(v){view=v;confirmReset=false;render();window.scrollTo(0,0);}
document.addEventListener('click',function(e){
  var t=e.target.closest('button');
  if(e.target.closest('#cine')&&cineDone){cineSkip();return;}
  if(!t)return;
  audio();
  if(!t.hasAttribute('data-opt')&&!t.hasAttribute('data-tile'))tapTick();
  var a=function(n){return t.hasAttribute(n);},g=function(n){return t.getAttribute(n);};
  if(a('data-cine-skip')){cineSkip();return;}
  /* navigation */
  if(a('data-tab')){if(g('data-tab')==='home'&&view!=='home')HOME_ANIM='tab';go(g('data-tab'));return;}
  if(a('data-lang')){if(save.lang!==g('data-lang')){save.lang=g('data-lang');HOME_ANIM='lang';store();render();}return;}
  if(a('data-mode-set')){if(save.mode!==g('data-mode-set')){save.mode=g('data-mode-set');HOME_ANIM='mode';store();render();}return;}
  if(a('data-node')){openNodeSheet(g('data-node'));return;}
  if(a('data-close-sheet')){closeSheet();return;}
  if(a('data-go')){closeSheet();startUnitFlight(g('data-go'));return;}
  if(a('data-scene')){startScene(g('data-scene'),g('data-scmode'));return;}
  if(a('data-mode')){startMode(g('data-mode'));return;}
  if(a('data-fly-next')){startUnitFlight(g('data-fly-next'));return;}
  if(a('data-next-lesson')){var nu=g('data-next-lesson'),wait=pendingFly&&!reduceMotion?2300:250;go('home');setTimeout(function(){if(view==='home')openNodeSheet(nu);},wait);return;}
  if(a('data-home')){go('home');return;}
  /* profession picker */
  if(a('data-picker')){pickerBack=(view==='record'?'record':'home');go('picker');return;}
  if(a('data-picker-close')){go(pickerBack);return;}
  if(a('data-pick')){save.prof=g('data-pick');if(save.prof&&pickerBack==='home')save.mode='job';store();go(pickerBack);return;}
  /* profile icon */
  if(a('data-icon-open')){openIconSheet();return;}
  if(a('data-icon-set')){save.icon=g('data-icon-set');store();closeSheet();render();return;}
  /* settings */
  if(a('data-level')){save.level=g('data-level');store();render();return;}
  if(a('data-goal')){save.goal=parseInt(g('data-goal'),10)||2;store();render();return;}
  if(a('data-theme-set')){save.theme=g('data-theme-set');store();applyTheme();render();return;}
  if(a('data-toggle-sound')){save.sound=!save.sound;store();render();return;}
  if(a('data-toggle-tap')){save.tap=!save.tap;store();render();return;}
  if(a('data-reset')){confirmReset=true;render();return;}
  if(a('data-reset-no')){confirmReset=false;render();return;}
  if(a('data-reset-yes')){save=defaults();confirmReset=false;store();applyTheme();obStep=0;obDraft={lang:save.lang,prof:'',level:'mid',goal:2};go('onboard');return;}
  /* onboarding */
  if(a('data-ob-lang')){obDraft.lang=g('data-ob-lang');render();return;}
  if(a('data-ob-prof')){obDraft.prof=g('data-ob-prof');render();return;}
  if(a('data-ob-level')){obDraft.level=g('data-ob-level');render();return;}
  if(a('data-ob-goal')){obDraft.goal=parseInt(g('data-ob-goal'),10);render();return;}
  if(a('data-ob-back')){obStep=Math.max(0,obStep-1);render();window.scrollTo(0,0);return;}
  if(a('data-ob-next')){
    if(obStep<3){obStep++;render();window.scrollTo(0,0);return;}
    save.lang=obDraft.lang;save.prof=obDraft.prof;save.level=obDraft.level;save.goal=obDraft.goal;save.onboarded=true;save.mode='daily';store();go('home');return;
  }
  /* scenes */
  if(SCX){
    if(a('data-sc-replay')||a('data-sc-slow')){var last=null;for(var i=SCX.log.length-1;i>=0;i--)if(SCX.log[i].who==='them'&&!SCX.log[i].typing){last=SCX.log[i].text;break;}if(last)scSay(last,a('data-sc-slow'));return;}
    if(a('data-sc-sub')){SCX.sub=!SCX.sub;t.setAttribute('aria-pressed',SCX.sub);scRefresh();return;}
    if(a('data-sc-tr')){SCX.tr=!SCX.tr;t.setAttribute('aria-pressed',SCX.tr);scRefresh();return;}
    if(a('data-sc-reveal')){scReveal();return;}
    if(a('data-sc-grade')){scGrade(parseInt(g('data-sc-grade'),10));return;}
    if(a('data-sc-send')){scSend();return;}
    if(a('data-sc-next')){scNext();return;}
    if(a('data-sc-hint')){SCX.hint=true;scRefresh();return;}
    if(a('data-sc-end')){
      $('sheetHost').innerHTML='<div class="sheet bad" role="alertdialog" aria-label="通話終了の確認"><div class="sheet-in"><h3>通話を終えますか？</h3><p class="dim" style="font-size:14px">ここまでの記録は保存されません。</p>'+
        '<div class="row2"><button class="ghost" type="button" data-abort-no style="flex:1">続ける</button><button class="ghost danger" type="button" data-sc-quit style="flex:1">終える</button></div></div></div>';
      return;
    }
    if(a('data-sc-quit')){sceneQuit();return;}
  }
  /* ATC roleplay */
  if(a('data-atc')){ATC.sc=null;go('atc');return;}
  if(a('data-atc-sc')){atcStart(parseInt(g('data-atc-sc'),10));return;}
  if(a('data-atc-list')){aiStop();ATC.sc=null;render();window.scrollTo(0,0);return;}
  if(a('data-atc-back')){if(ATC.ctl){try{ATC.ctl.abort();}catch(x){}}ATC.busy=false;if(ATC.sc){ATC.sc=null;render();window.scrollTo(0,0);}else go('review');return;}
  if(a('data-atc-send')){atcSend();return;}
  if(a('data-atc-hint')){ATC.hint=true;var hl=$('atcHint');if(hl){hl.textContent='例: '+ATC.sc.hint;hl.classList.remove('hidden-hint');}t.hidden=true;return;}
  if(a('data-atc-say')){var m=ATC.log[parseInt(g('data-atc-say'),10)];if(m)speak(m.text,'en-US',false,true);return;}
  /* AI ask */
  if(a('data-ai-open')){aiOpen();return;}
  if(a('data-ai-q')){aiAsk(AI_Q[parseInt(g('data-ai-q'),10)]);return;}
  if(a('data-ai-send')){var ai=$('aiIn');if(ai)aiAsk(ai.value.trim());return;}
  if(a('data-abort-no')){closeSheet();return;}
  /* flight */
  if(!F)return;
  if(a('data-hear')||a('data-slow')){if(F.cur){var d=dat(F.cur.it);speak(d.t,LANGS[F.lang].tts,a('data-slow'),true);}return;}
  if(a('data-opt')){onOption(parseInt(g('data-opt'),10));return;}
  if(a('data-check')){onCheck();return;}
  if(a('data-next')){nextStep();return;}
  if(a('data-tile')&&F.build&&!F.answered){
    var ti=parseInt(g('data-tile'),10);
    if(F.build.placed.indexOf(ti)<0){F.build.placed.push(ti);drawBuild();tone(520,0.06,'triangle',0.04,0);}
    return;
  }
  if(a('data-untile')&&F.build&&!F.answered){F.build.placed.splice(parseInt(g('data-untile'),10),1);drawBuild();return;}
  if(a('data-clear')&&F.build&&!F.answered){F.build.placed=[];drawBuild();return;}
  if(a('data-peek')){if(F.cur&&!F.peeked){F.peeked=true;board.set(dat(F.cur.it).t);t.hidden=true;}return;}
  if(a('data-abort')){abortAsk();return;}
  if(a('data-abort-yes')){leaveFlight();return;}
});
document.addEventListener('input',function(e){
  if(e.target&&e.target.id==='pname'){save.name=(e.target.value||'').slice(0,14)||'PASSENGER';store();}
});
document.addEventListener('keydown',function(e){
  var id=e.target&&e.target.id;
  if(e.key==='Escape'&&cineDone){cineSkip();return;}
  if(e.key==='Enter'&&id==='atcIn'){e.preventDefault();atcSend();return;}
  if(e.key==='Enter'&&id==='aiIn'){e.preventDefault();aiAsk(e.target.value.trim());return;}
  if(e.key==='Enter'&&id==='scIn'){e.preventDefault();scSend();return;}
  if(view!=='flight'||!F||!F.cur||cineDone)return;
  if(document.querySelector('[data-abort-yes]'))return;
  if(id==='aiIn')return;
  var inField=id==='ans';
  if(e.key==='Enter'){
    if(F.answered){e.preventDefault();nextStep();}
    else if(F.cur.k==='type'&&inField){e.preventDefault();onCheck();}
    return;
  }
  if(!F.answered&&!inField&&/^[1-4]$/.test(e.key)&&document.querySelector('.opt')&&answerReady()){
    var i=parseInt(e.key,10)-1;if(i<F.opts.length)onOption(i);
  }
});
document.addEventListener('visibilitychange',function(){if(document.hidden){try{speechSynthesis.cancel();}catch(e){}}});
var rsT=0;window.addEventListener('resize',function(){clearTimeout(rsT);rsT=setTimeout(function(){if(view==='home')mapMount();},200);});

applyTheme();
initSky();
if(!save.onboarded){view='onboard';obStep=0;obDraft={lang:save.lang,prof:save.prof,level:save.level,goal:save.goal};}
render();
initCloud();
initAI();
})();
</script>
