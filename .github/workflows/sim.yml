# 試作ルーム（シミュレーション）: branch "sim" に push すると、本番(babelflight.com)とは別の
# Worker「babel-flight-sim」と別のデータベース「babel-flight-sim-db」に配信する。
# 本番と同じコードで、データは共有しない。本番用の MOVE_KEY は使わない。
#
# 進め方: 試作は sim ブランチで作って確認する → 良ければ main に取り込む（main に入ると本番に出る）。
# 必要なもの: 本番と同じ CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID（すでにある）。
# sim用のWorkerの秘密情報（ANTHROPIC_API_KEY など）は、Cloudflare の画面で sim 用に別途設定する。
name: Deploy simulation room

on:
  push:
    branches: [sim]
  workflow_dispatch:

concurrency:
  group: sim-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: github.repository_owner == 'Yoshiusagi'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER: wrangler@4.148.0
    steps:
      - name: Is Cloudflare set up?
        id: ready
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Cloudflare isn't set up yet (CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID). Nothing was deployed."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.ready.outputs.ok == 'true'

      - uses: oven-sh/setup-bun@v2
        if: steps.ready.outputs.ok == 'true'
        with:
          bun-version: 1.2.21

      - name: Install
        if: steps.ready.outputs.ok == 'true'
        working-directory: app
        run: bun install --frozen-lockfile

      - name: Build
        if: steps.ready.outputs.ok == 'true'
        working-directory: app
        run: bun run build

      - name: Recorded voices (branch "voices", from voices.yml)
        if: steps.ready.outputs.ok == 'true'
        working-directory: app
        run: |
          if git fetch -q --depth=1 origin voices; then
            mkdir -p dist/client/voice
            git -C .. archive FETCH_HEAD | tar -x -C dist/client/voice
            echo "voices: $(find dist/client/voice -name '*.mp3' | wc -l) files"
          else
            echo "::notice::No recorded voices yet; the page uses the device's voice."
          fi

      - name: Database (sim, made once, then found by name)
        if: steps.ready.outputs.ok == 'true'
        working-directory: app
        run: |
          set -euo pipefail
          find_db() { bunx "$WRANGLER" d1 list --json | jq -r '.[] | select(.name=="babel-flight-sim-db") | .uuid'; }
          id="$(find_db)"
          if [ -z "$id" ]; then
            bunx "$WRANGLER" d1 create babel-flight-sim-db --location apac
            id="$(find_db)"
          fi
          [ -n "$id" ] || { echo "::error::Could not find or create the database babel-flight-sim-db"; exit 1; }
          sed "s/__DB_ID__/$id/" wrangler.sim.jsonc > wrangler.sim-deploy.jsonc

      - name: Database tables
        if: steps.ready.outputs.ok == 'true'
        working-directory: app
        run: bunx "$WRANGLER" d1 migrations apply DB --remote --config wrangler.sim-deploy.jsonc

      - name: Publish (simulation room)
        if: steps.ready.outputs.ok == 'true'
        working-directory: app
        run: bunx "$WRANGLER" deploy --config wrangler.sim-deploy.jsonc
