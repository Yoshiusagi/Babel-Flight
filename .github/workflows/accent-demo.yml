# One-off: records the 訛りの英語 demo (demo/accent.py). Lives only on the branch accent-demo.
name: Accent demo
on:
  push:
    branches: [accent-demo]
permissions:
  contents: write
jobs:
  rec:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/kokoro
          key: kokoro-onnx-model-v1.0
      - name: Install
        run: |
          set -euo pipefail
          mkdir -p ~/kokoro && cd ~/kokoro
          base=https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0
          [ -s kokoro-v1.0.onnx ] || curl -fsSLO "$base/kokoro-v1.0.onnx"
          [ -s voices-v1.0.bin ] || curl -fsSLO "$base/voices-v1.0.bin"
          pip install -q kokoro-onnx soundfile
          command -v ffmpeg >/dev/null || { sudo apt-get update -q && sudo apt-get install -y -q ffmpeg >/dev/null; }
      - run: python3 demo/accent.py
      - name: Save to this branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add demo/out
          git commit -q -m "訛りの英語の試聴用の録音"
          git push origin HEAD:accent-demo
