# Builds the iPhone app on GitHub's Mac machines (free for public repositories).
#
#  - Every push that touches the app: checks the server code, builds the iPhone app for the simulator,
#    opens it in the simulator and takes a screenshot. The screenshot and build log are saved to the
#    `ios-ci` branch so they can be looked at without signing in.
#  - "Run workflow" with "upload" ticked: signs the app and sends it to App Store Connect (TestFlight).
#    Needs the secrets listed in ios-app/README.md.
name: iPhone app

on:
  push:
    branches: [main]
    paths:
      - "ios-app/**"
      - "app/babel-flight/**"
      - "app/src/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch:
    inputs:
      upload:
        description: "App Store Connect にアップロードする (TestFlight)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Server typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck

  ios:
    name: iPhone build
    runs-on: macos-15
    timeout-minutes: 75
    env:
      UPLOAD: ${{ github.event_name == 'workflow_dispatch' && inputs.upload == true }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Pick the newest Xcode
        run: |
          ls -d /Applications/Xcode*.app
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          [ -z "$X" ] && X=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$X"
          xcodebuild -version | tee -a "$RUNNER_TEMP/summary.txt"

      - name: Install packages
        working-directory: ios-app
        run: |
          npm install --no-audit --no-fund --legacy-peer-deps > "$RUNNER_TEMP/npm.log" 2>&1 \
            || { grep -E "ERR|error" "$RUNNER_TEMP/npm.log" | head -20 | sed 's/^/::error::/'; exit 1; }
          npm ls --depth=0 | tee -a "$RUNNER_TEMP/summary.txt"

      - name: Build the page (www)
        working-directory: ios-app
        run: node scripts/build-www.mjs | tee -a "$RUNNER_TEMP/summary.txt"

      - name: Firebase config for iOS
        env:
          GOOGLE_SERVICE_INFO_PLIST: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}
        working-directory: ios-app
        run: |
          if [ -n "$GOOGLE_SERVICE_INFO_PLIST" ] && [ ! -f GoogleService-Info.plist ]; then
            if echo "$GOOGLE_SERVICE_INFO_PLIST" | grep -q "<plist"; then printf '%s' "$GOOGLE_SERVICE_INFO_PLIST" > GoogleService-Info.plist
            else echo "$GOOGLE_SERVICE_INFO_PLIST" | base64 --decode > GoogleService-Info.plist; fi
          fi
          [ -f GoogleService-Info.plist ] && echo "Firebase config: yes" || echo "Firebase config: placeholder"

      - name: Create the Xcode project
        working-directory: ios-app
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ALLOW_PLACEHOLDER_FIREBASE: ${{ env.UPLOAD == 'true' && '0' || '1' }}
        run: |
          set -o pipefail
          npx cap add ios 2>&1 | tail -25
          ruby scripts/configure-ios.rb 2>&1 | tee -a "$RUNNER_TEMP/summary.txt"
          npx cap sync ios > "$RUNNER_TEMP/sync.log" 2>&1 \
            || { tail -30 "$RUNNER_TEMP/sync.log" | sed 's/^/::error::/'; exit 1; }
          tail -15 "$RUNNER_TEMP/sync.log"

      - name: Build for the simulator
        if: env.UPLOAD != 'true'
        working-directory: ios-app/ios/App
        run: |
          set -o pipefail
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/dd" CODE_SIGNING_ALLOWED=NO build > "$RUNNER_TEMP/xcodebuild.log" 2>&1 \
            || { grep -E "error:|fatal" "$RUNNER_TEMP/xcodebuild.log" | head -25 | sed 's/^/::error::/'; exit 1; }
          echo "simulator build: OK" | tee -a "$RUNNER_TEMP/summary.txt"

      - name: Open it in the simulator
        if: env.UPLOAD != 'true'
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json,sys
          d=json.load(sys.stdin)['devices']
          c=[(r,x) for r,l in d.items() if 'iOS' in r for x in l if x['name'].startswith('iPhone') and 'Pro Max' in x['name']]
          c=c or [(r,x) for r,l in d.items() if 'iOS' in r for x in l if x['name'].startswith('iPhone')]
          c.sort(key=lambda t:t[0]); print(c[-1][1]['udid'])")
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl status_bar "$UDID" override --time 9:41 --batteryLevel 100 --cellularBars 4 || true
          xcrun simctl install "$UDID" "$RUNNER_TEMP/dd/Build/Products/Debug-iphonesimulator/App.app"
          xcrun simctl launch "$UDID" io.github.yoshiusagi.babelflight
          sleep 25
          mkdir -p "$RUNNER_TEMP/report"
          xcrun simctl io "$UDID" screenshot "$RUNNER_TEMP/report/launch.png"
          xcrun simctl spawn "$UDID" log show --last 2m --predicate 'process == "App"' --style compact 2>/dev/null | grep -iE "error|exception|⚡️|capacitor" | tail -60 > "$RUNNER_TEMP/report/app-log.txt" || true

      - name: Sign and upload to App Store Connect
        if: env.UPLOAD == 'true'
        working-directory: ios-app/ios/App
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_KEY: ${{ secrets.APP_STORE_CONNECT_KEY }}
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -o pipefail
          for v in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY TEAM; do [ -n "${!v}" ] || { echo "::error::secret for $v is missing (see ios-app/README.md)"; exit 1; }; done
          KEY="$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"; printf '%s' "$ASC_KEY" > "$KEY"
          AUTH=(-allowProvisioningUpdates -authenticationKeyPath "$KEY" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID")
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" "${AUTH[@]}" DEVELOPMENT_TEAM="$TEAM" archive > "$RUNNER_TEMP/xcodebuild.log" 2>&1 \
            || { grep -E "error:|fatal" "$RUNNER_TEMP/xcodebuild.log" | head -25 | sed 's/^/::error::/'; exit 1; }
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          EOF
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" "${AUTH[@]}" 2>&1 | tail -30
          echo "uploaded build ${{ github.run_number }} to App Store Connect" | tee -a "$RUNNER_TEMP/summary.txt"
          rm -f "$KEY"

      - name: Save the report to the ios-ci branch
        if: always() && github.event_name == 'push'
        env:
          TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/report" && cd "$RUNNER_TEMP/report"
          cp "$RUNNER_TEMP/summary.txt" . 2>/dev/null || true
          for f in npm sync; do [ -f "$RUNNER_TEMP/$f.log" ] && tail -60 "$RUNNER_TEMP/$f.log" > "$f-log.txt"; done
          [ -f "$RUNNER_TEMP/xcodebuild.log" ] && grep -E "error:|warning: .*(deprecated|Firebase)|BUILD (SUCCEEDED|FAILED)|\*\* " "$RUNNER_TEMP/xcodebuild.log" | tail -80 > xcodebuild-summary.txt || true
          echo "run ${{ github.run_number }} ・ ${{ github.sha }} ・ ${{ job.status }}" > README.md
          git init -q -b ios-ci && git add -A
          git -c user.name="github-actions" -c user.email="actions@github.com" commit -qm "iPhone build report ${{ github.run_number }}"
          git push -qf "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.git" ios-ci
